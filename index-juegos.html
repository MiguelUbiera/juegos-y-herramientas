<html lang="es">

<script>
(function(){
  var inicio, pendiente;
  function ver(){
    var b = document.body;
    window.clearTimeout(pendiente);
    if (!b){ pendiente = window.setTimeout(ver, 100); return; }
    if (b.classList.contains('pagina-lista')) return;
    if (inicio === undefined) inicio = performance.now();
    var restante = window.matchMedia('(prefers-reduced-motion: reduce)').matches
      ? 0 : 1100 - (performance.now() - inicio);
    if (restante > 0) { pendiente = window.setTimeout(ver, restante); return; }
    b.classList.remove('pagina-cargando');
    b.classList.add('pagina-lista');
  }
  window.s321MostrarPagina = ver;
  ver();
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&family=Nunito:wght@400;600;700;800&family=Source+Code+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pe-hondo:#0f2d3a; --pe-base:#173f50; --pe-caja:#2a4e5e; --pe-claro:#2c5c70;
  --no-panel-linea:#346375;
  --te-hondo:#8f3a1e; --te-claro:#e08a5f;
  --ok:#327a52; --crema:#f7f1e9; --papel:#fffcf7; --borde-calido:#e4c5b5;
  --ti:#1b1512; --ti-t:#4a3f38;
  --lora:"Lora",Georgia,"Times New Roman",serif;
  --nunito:"Nunito",system-ui,sans-serif;
  --mono:"Source Code Pro",ui-monospace,"Courier New",monospace;
  --dur-rapida:160ms; --dur-base:260ms; --dur-media:380ms; --dur-lenta:560ms;
  --ease-salida:cubic-bezier(.16,1,.3,1); --ease-entrada:cubic-bezier(.7,0,.84,0);
  --ease-estandar:cubic-bezier(.2,.8,.2,1); --ease-enfasis:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html,body{margin:0}
html{hyphens:auto}
body{
  color:var(--crema);
  font-family:var(--nunito); font-size:16px; font-weight:400; line-height:1.45;
  background:#0b1f28;
}
.escenario{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden}
.escenario .base{position:absolute; inset:0; background:
  radial-gradient(720px 420px at 12% -10%, rgba(224,138,95,.18), transparent 60%),
  radial-gradient(560px 380px at 100% 0%, rgba(34,86,108,.55), transparent 55%),
  linear-gradient(180deg,#123445 0%, #0f2d3a 42%, #0b1f28 100%);}
.escenario .halo{
  position:absolute; width:520px; height:520px; left:8%; top:-8%;
  background:radial-gradient(circle, rgba(176,74,42,.1), transparent 72%);
  animation:deriva 26s var(--ease-estandar) infinite alternate;
}
.escenario .geom{
  position:absolute; inset:0; width:auto; height:auto; opacity:.2;
  background:
    linear-gradient(rgba(247,241,233,.16) 1px, transparent 1px) 0 0 / 28px 28px,
    linear-gradient(90deg, rgba(247,241,233,.16) 1px, transparent 1px) 0 0 / 28px 28px;
  mask-image:radial-gradient(circle at 30% 30%, #000 20%, transparent 72%);
}
.escenario .vineta{position:absolute; inset:0; background:radial-gradient(circle at 50% 30%, transparent 40%, rgba(8,20,28,.55) 100%)}
body[data-vista="salas"] .escenario .halo{left:auto; right:-40px; background:radial-gradient(circle, rgba(44,92,112,.16), transparent 72%)}
body[data-vista="catalogo"] .escenario .halo{left:40%; top:40px; background:radial-gradient(circle, rgba(90,58,82,.14), transparent 72%)}
body[data-vista="orientador"] .escenario .halo{left:0; top:80px; background:radial-gradient(circle, rgba(224,138,95,.1), transparent 72%)}
body[data-vista="sala"] .escenario .halo{background:radial-gradient(circle, color-mix(in srgb, var(--halo,#e08a5f) 14%, transparent), transparent 74%)}
@keyframes deriva{from{transform:translate3d(0,0,0)} to{transform:translate3d(40px,28px,0)}}
.skip{position:absolute; left:16px; top:8px; transform:translateY(-150%); background:var(--papel); color:var(--ti); padding:8px 16px; z-index:30}
.skip:focus{transform:none}
:focus{outline:none}
:focus-visible{outline:2px solid var(--te-claro); outline-offset:3px}
.sr{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0}
#marco{position:fixed; inset:0; overflow:auto}
#app{
  position:relative; left:auto; top:auto;
  width:100%; min-height:100%; height:auto;
  margin:0; padding:clamp(12px, 2vw, 36px) clamp(16px, 3vw, 48px);
  transform:none; display:flex; flex-direction:column; gap:12px; overflow:visible;
}
#app h1,#app h2,#app h3,#app p,#app a,#app button,#app li,#app span,#app label{
  min-width:0; max-width:100%; overflow-wrap:break-word; word-break:normal; hyphens:auto;
}
.barra{
  min-height:64px; height:auto; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  background:linear-gradient(180deg, rgba(15,45,58,.5), rgba(15,45,58,.22));
  border-bottom:1px solid rgba(228,197,181,.22);
}
.marca{display:flex; align-items:center; gap:12px; color:inherit; text-decoration:none; min-height:44px; font-family:var(--lora); font-weight:600; font-size:20px; line-height:1.2}
.marca svg{width:36px; height:36px; flex:0 0 auto}
.nav{display:flex; gap:4px; margin-left:auto; flex-wrap:wrap}
.nav a,.btn{
  display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:8px 16px;
  font:500 16px/1.2 var(--nunito); text-decoration:none; color:var(--crema);
  border:1px solid transparent; background:transparent; cursor:pointer; border-radius:11px;
}
.nav a{position:relative}
.nav a[aria-current="page"]::after{
  content:""; position:absolute; left:16px; right:16px; bottom:6px; height:2px; background:var(--te-claro);
  transform-origin:left; animation:linea var(--dur-base) var(--ease-enfasis);
}
@keyframes linea{from{transform:scaleX(.2)} to{transform:scaleX(1)}}
.btn-primario,.accion{
  position:relative;
  background:var(--te-hondo); color:var(--crema); border:1px solid #a34a2c;
  display:inline-flex; align-items:center; gap:8px; min-height:40px; height:40px; padding:0 16px;
  font:500 16px/1.2 var(--nunito); text-decoration:none; cursor:pointer; border-radius:11px;
  box-shadow:inset 0 1px 0 rgba(247,241,233,.25), 0 8px 18px rgba(143,58,30,.28);
  transition:transform var(--dur-rapida) var(--ease-salida), background var(--dur-base) var(--ease-estandar);
}
.btn-primario::after,.accion::after{content:""; width:8px; height:8px; border-right:2px solid currentColor; border-top:2px solid currentColor; transform:rotate(45deg); transition:transform var(--dur-rapida) var(--ease-enfasis)}
.btn-primario:hover::after,.accion:hover::after{transform:translateX(3px) rotate(45deg)}
.btn-primario:active,.accion:active{transform:translateY(1px)}
.btn-sec,.btn-ghost{
  display:inline-flex; align-items:center; min-height:40px; height:40px; padding:0 16px; border-radius:11px;
  font:500 16px/1.2 var(--nunito); cursor:pointer; color:var(--crema);
  background:transparent; border:1px solid rgba(228,197,181,.45);
  transition:border-color var(--dur-rapida) var(--ease-salida), background var(--dur-rapida) var(--ease-salida);
}
.btn-sec:hover,.btn-ghost:hover{background:rgba(247,241,233,.06)}
main{min-width:0; min-height:0; overflow:hidden; display:flex; flex-direction:column}
.lienzo{flex:1; min-height:0; min-width:0; overflow:auto; overscroll-behavior:contain; view-transition-name:lienzo; padding:8px 0}
.lienzo.sale{opacity:0; transform:translateY(18px); transition:opacity var(--dur-base) var(--ease-entrada), transform var(--dur-base) var(--ease-entrada)}
.lienzo.entra > *{animation:sube var(--dur-media) var(--ease-salida) both}
.lienzo.entra > *:nth-child(2){animation-delay:50ms}
@keyframes sube{from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:none}}
h1,h2,h3{font-family:var(--lora); font-weight:600; line-height:1.15; letter-spacing:-.02em; margin:0}
h1{font-size:36px; view-transition-name:titulo}
h2{font-size:24px}
h3{font-size:18px; color:var(--crema)}
.kicker{margin:0; font-family:var(--mono); font-size:12px; line-height:1.3; letter-spacing:.04em; color:var(--te-claro)}
.bajada{margin:0; color:#f3e6df; font-size:17px; line-height:1.35}
.lienzo:has(> .portada){position:relative; overflow:visible; padding:0}
.portada{
  position:relative; left:auto; top:auto; width:100%; height:auto;
  display:grid; grid-template-columns:minmax(0, 1.05fr) minmax(280px, .95fr); column-gap:clamp(16px, 2vw, 28px); row-gap:20px;
}
.entrada{width:auto; height:auto; display:flex; flex-direction:column; gap:8px}
.entrada h1{font-size:clamp(34px, 4vw, 52px); line-height:1.05; max-width:18ch}
.resumen{display:flex; flex-wrap:wrap; gap:12px 16px; margin:0; font-size:14px; color:#f3e6df}
.resumen span{border-bottom:1px solid rgba(228,197,181,.35)}
.acciones{display:flex; flex-wrap:wrap; gap:8px; margin:0}
.escena-salas{width:auto; height:auto; display:grid; grid-template-rows:auto minmax(0, 1fr); align-content:start; gap:8px}
.escena-salas h2{font-size:24px; line-height:1.2}
.indice{
  display:grid; grid-template-columns:1fr 1fr; grid-auto-rows:minmax(40px, auto);
  gap:8px 12px; margin:0; padding:0; list-style:none;
}
.indice a{
  display:flex; align-items:center; gap:8px; width:100%; height:auto; min-height:44px;
  padding:0 13px; border-radius:11px; font-size:15px;
  color:var(--crema); text-decoration:none; background:rgba(23,63,80,.72);
  border:1px solid var(--no-panel-linea);
  transition:transform var(--dur-rapida) var(--ease-enfasis), background var(--dur-base) var(--ease-estandar);
}
.indice a:hover{transform:translateY(-1px)}
.indice .n{font-family:var(--mono); font-size:12px; color:var(--te-claro)}
.indice strong{font-weight:600; font-family:var(--lora); font-size:15px}
.destacado{
  position:relative; left:auto; top:auto; width:100%; height:auto;
  display:grid; grid-template-columns:minmax(0, 1.4fr) minmax(180px, .6fr); gap:clamp(12px, 2vw, 28px);
  padding:18px; align-items:center; margin-top:16px;
  background:linear-gradient(135deg, rgba(224,138,95,.16), transparent 42%), #143646;
  border:1px solid rgba(228,197,181,.35); border-radius:28px;
  box-shadow:inset 0 1px 0 rgba(247,241,233,.12), 0 24px 40px rgba(8,24,32,.35);
}
.destacado .lectura{width:auto; height:auto; padding:16px; background:var(--papel); color:var(--ti); border-radius:18px; display:flex; flex-direction:column; gap:8px}
.destacado h2{font-size:clamp(22px, 2.4vw, 28px); color:var(--pe-hondo); line-height:1.1}
.destacado .lectura p{font-size:17px; line-height:1.35; margin:0}
.destacado .estado{font-size:14px; color:var(--ti-t)}
.dominos{width:min(100%, 380px); height:auto; justify-self:center; align-self:center}
.lienzo:has(.mosaico){display:flex; flex-direction:column; gap:12px; padding:8px 0 0; overflow:visible}
.mosaico{
  width:100%; height:auto; margin:0;
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(min(100%, 220px), 1fr));
  gap:14px;
}
.sala-btn{
  --mx:50%; --my:40%;
  appearance:none; text-align:left; cursor:pointer; width:100%; height:auto; min-height:148px; color:var(--crema);
  background:linear-gradient(160deg, rgba(247,241,233,.05), transparent 36%), #16384a;
  border:1px solid rgba(228,197,181,.16); border-radius:18px;
  padding:18px;
  display:flex; flex-direction:column; align-items:flex-start; gap:6px;
  box-shadow:inset 0 1px 0 rgba(247,241,233,.14), 0 12px 24px rgba(8,22,30,.28);
  position:relative;
  transition:border-color var(--dur-rapida) var(--ease-salida);
}
.sala-btn::before{
  content:""; position:absolute; inset:0; border-radius:18px; pointer-events:none;
  background:radial-gradient(180px circle at var(--mx) var(--my), rgba(224,138,95,.22), transparent 60%);
  opacity:0; transition:opacity var(--dur-base) var(--ease-salida);
}
.sala-btn::after{content:""; position:absolute; left:0; top:18px; height:28px; width:3px; border-radius:2px; background:var(--marca, var(--te-claro))}
.sala-btn:hover::before,.sala-btn:focus-visible::before{opacity:1}
.sala-btn svg{width:52px; height:52px; flex:0 0 52px; position:relative; z-index:1}
.sala-btn .n{font-family:var(--mono); font-size:12px; color:var(--te-claro); position:relative; z-index:1}
.sala-btn h2{font-size:23px; line-height:1.1; position:relative; z-index:1}
.sala-btn .lema{margin:0; font-size:15px; line-height:1.25; color:#f7f1e9; position:relative; z-index:1}
.sala-btn .gesto{margin:0; font-size:13px; line-height:1.25; color:#d9cfc4; position:relative; z-index:1}
.pie{
  height:48px; margin-top:auto; width:100%;
  display:flex; flex-direction:column; justify-content:flex-end; gap:2px;
  padding-top:4px; border-top:1px solid rgba(247,241,233,.12);
  font-size:13px; position:relative; z-index:1;
}
.ok{color:#9ddec0; font-weight:500}
.espera{color:#d9cfc4; font-weight:500}
.cue{color:var(--te-claro); font-weight:500}
.trazo{stroke:var(--te-claro)}
.sala-btn[data-sala="desafio"]:hover svg{animation:peldaño var(--dur-media) var(--ease-enfasis)}
.sala-btn[data-sala="memoria"]:hover svg rect:last-child{animation:huella var(--dur-lenta) var(--ease-estandar)}
.sala-btn[data-sala="velocidad"]:hover svg{animation:pulso var(--dur-media) var(--ease-enfasis)}
.sala-btn[data-sala="estrategia"]:hover svg{animation:bifurca var(--dur-media) var(--ease-enfasis)}
.sala-btn[data-sala="concentracion"]:hover svg path.trazo{animation:revela var(--dur-media) var(--ease-enfasis)}
.sala-btn[data-sala="probabilidad"]:hover svg{animation:reparte var(--dur-media) var(--ease-estandar)}
.sala-btn[data-sala="tiempo"]:hover svg{animation:intervalo var(--dur-lenta) var(--ease-estandar)}
.sala-btn[data-sala="calculo"]:hover svg{animation:recompone var(--dur-media) var(--ease-enfasis)}
.sala-btn[data-sala="analisis"]:hover svg{animation:enlaza var(--dur-media) var(--ease-estandar)}
.sala-btn[data-sala="construccion"]:hover svg{animation:ensambla var(--dur-media) var(--ease-enfasis)}
@keyframes peldaño{from{transform:translateY(8px)} to{transform:none}}
@keyframes huella{from{opacity:.25} to{opacity:1}}
@keyframes pulso{0%{transform:translateX(-6px)} 100%{transform:none}}
@keyframes bifurca{from{transform:scale(.94)} to{transform:none}}
@keyframes revela{from{stroke-dashoffset:12} to{stroke-dashoffset:0}}
@keyframes reparte{from{transform:translateY(6px)} to{transform:none}}
@keyframes intervalo{from{transform:scaleX(.86); transform-origin:left} to{transform:none}}
@keyframes recompone{from{transform:translateX(-5px)} to{transform:none}}
@keyframes enlaza{from{transform:scaleX(.9)} to{transform:none}}
@keyframes ensambla{from{transform:translateY(5px)} to{transform:none}}
.lienzo.entra .sala-btn{animation:sube var(--dur-media) var(--ease-salida) both}
.volver{appearance:none; background:none; border:0; color:var(--te-claro); min-height:44px; padding:8px 0; font:500 16px/1.2 var(--nunito); cursor:pointer}
.cabeza-sala{display:flex; flex-direction:column; gap:8px; margin:0 0 12px; padding-bottom:8px; border-bottom:1px solid rgba(228,197,181,.25)}
.cabeza-sala .meta{margin:0; font-size:14px; color:#f3e6df}
.sala-hero{display:flex; align-items:center; gap:16px}
.sala-hero svg{width:52px; height:52px; flex:0 0 auto}
.layout-sala{display:grid; grid-template-columns:1.35fr .75fr; gap:16px; min-height:0; flex:1}
.layout-sala h2{margin:0 0 10px}
.lienzo:has(.layout-sala), .lienzo:has(#lista-juegos){display:flex; flex-direction:column; overflow:hidden}
#lista-juegos,.layout-sala > div:first-child,.pedagogia{min-height:0; overflow:auto; overscroll-behavior:contain}
.tabs{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 8px}
.tabs button{min-height:40px; padding:8px 14px; border-radius:11px; border:1px solid var(--no-panel-linea); background:#16384a; color:var(--crema); font:500 14px/1.2 var(--nunito); cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--papel); color:var(--ti); border-color:var(--papel)}
.panel{padding:16px}
.lectura{background:var(--papel); color:var(--ti); border-radius:18px}
.lectura .estado{color:var(--ti-t)}
.lectura .kicker{color:var(--te-hondo)}
.panel p,.sinopsis{margin:0}
.mecanicas{margin:12px 0 0; font-family:var(--mono); font-size:12px; line-height:1.4; color:var(--ti-t)}
.catalogo,.lista{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:1fr 1fr; gap:12px}
.catalogo li,.lista li{
  padding:16px; display:flex; flex-direction:column; gap:8px; border-radius:14px;
  background:#143646; color:var(--crema); border:1px solid var(--no-panel-linea);
  border-left:3px solid var(--marca, var(--te-claro));
}
.catalogo li.listo,.lista li.listo{background:linear-gradient(180deg, rgba(224,138,95,.12), #173f50 40%)}
.estado{margin:0; font-size:14px; color:#d9cfc4}
.fila-acc{display:flex; flex-wrap:wrap; gap:8px}
.filtros{
  display:grid; grid-template-columns:1.4fr .8fr .8fr auto; gap:12px; align-items:end;
  margin:0 0 12px; padding:16px; border-radius:22px;
  background:rgba(15,45,58,.55); border:1px solid rgba(228,197,181,.22);
}
.campo label{display:block; margin-bottom:8px; font-size:14px; font-weight:500; color:var(--crema)}
.campo input,.campo select{
  width:100%; min-height:40px; border-radius:11px; border:1px solid var(--no-panel-linea);
  background:#0f2d3a; color:var(--crema); padding:8px 12px; font:400 16px/1.4 var(--nunito);
}
.cuenta{margin:0 0 12px; font-size:14px; color:var(--te-claro)}
.vacio{padding:18px; border-radius:22px; background:#143646; border:1px solid var(--no-panel-linea)}
.ficha{display:grid; gap:12px}
.ficha-escena{
  display:grid; gap:16px; padding:20px; border-radius:28px;
  background:linear-gradient(160deg, rgba(224,138,95,.14), #123445 46%);
  border:1px solid rgba(228,197,181,.32);
}
.nota{color:#f3e6df; font-size:14px; margin:6px 0 0}
.ejes{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin:12px 0}
.eje{padding:14px; border-radius:22px; background:#143646; border:1px solid var(--no-panel-linea); border-top:2px solid var(--te-claro)}
.resultado{padding:18px}
.resultado h2{color:var(--pe-hondo); margin:4px 0 8px; font-size:28px}
.receta{margin:12px 0; padding:12px 16px; border-left:4px solid var(--te-hondo); background:#f9f3ea; color:var(--ti)}
.aviso{padding:12px 16px; background:#234c5e; border:1px solid #346375}
.meta{margin:0; font-size:14px; color:#f3e6df}
#senal-proyeccion{display:none; margin:0 0 0 8px; font-family:var(--mono); font-size:12px; color:var(--te-claro)}
body.proyeccion #senal-proyeccion{display:block}
body.proyeccion footer.pie-pag, body.proyeccion .mecanicas{display:none}
footer.pie-pag{
  height:50px; margin:0; padding:0;
  display:flex; justify-content:space-between; align-items:center; gap:16px;
  border-top:1px solid rgba(247,241,233,.14); color:#d9cfc4; font-size:12px; line-height:1.3;
}
footer.pie-pag p{margin:0}
::view-transition-old(lienzo){animation:sale-vt var(--dur-media) var(--ease-entrada) both}
::view-transition-new(lienzo){animation:entra-vt var(--dur-media) var(--ease-salida) both}
@keyframes sale-vt{to{opacity:0; transform:translateY(-12px)}}
@keyframes entra-vt{from{opacity:0; transform:translateY(22px)}}
#giro{position:fixed; inset:0; z-index:40; display:grid; place-items:center; padding:24px; background:#0f2d3a; color:#f7f1e9}
#giro[hidden]{display:none}
.giro-caja{max-width:24rem}
.giro-caja svg{width:88px; height:88px}
.giro-caja h2{font-size:32px; margin:8px 0}
.giro-flecha{transform-origin:40px 66px; animation:girar 1.6s ease-in-out infinite}
@keyframes girar{from{transform:rotate(-12deg)} to{transform:rotate(78deg)}}
body.flujo #marco{position:static; overflow:visible; height:auto}
body.flujo #app{
  position:relative; left:auto; top:auto; width:100%; height:auto;
  transform:none; overflow:visible;
  display:flex; flex-direction:column;
  padding:16px;
}
body.flujo .portada,body.flujo .destacado,body.flujo .escena-salas,body.flujo .entrada,

<script type="application/json" id="datos">{"zonas": [{"id": "desafio", "nombre": "Desafío", "lema": "La dificultad sube. El reloj no manda.", "gesto": "Producir y decidir con exigencia creciente", "presion": "calma-exigente", "acento": "#b04a2a", "presentacion": {"que_es": "Una ronda vale si el siguiente peldaño pide más que el anterior: más cifras, una condición nueva, o un camino que ya no se puede resolver de un golpe de vista.", "como_se_articula": "Se fija un criterio único. Se construyen diez peldaños. Cada peldaño cambia una sola variable. El estudiante ve el peldaño, resuelve, y solo entonces aparece el siguiente. No hay ranking. Hay umbral.", "que_no_es": "No es una lista de ejercicios con confeti. Si el gesto no cambia de exigencia, es cálculo disfrazado.", "para_el_aula": "En PDI, un estudiante resuelve el peldaño a la vista. El resto pronostica si va a alcanzar. El maestro señala el criterio, no la cuenta.", "mecanicas": ["PR-2", "PR-3", "EL-2", "BU-1"]}, "juegos": [{"id": "tres-condiciones", "nombre": "Tres condiciones", "sinopsis": "Cada grupo de casillas cumple una condición. Las fichas de dominó no se solapan.", "estado": "listo", "archivo": "juegos/desafio/tres-condiciones/tres-condiciones.html"}]}, {"id": "memoria", "nombre": "Memoria", "lema": "Lo que se tapó sigue contando.", "gesto": "Retener y emparejar", "presion": "calma", "acento": "#5a3a52", "presentacion": {"que_es": "Se muestra, se tapa, se pide. La matemática no está en recordar dibujos: está en recordar una cantidad, una relación o una posición que todavía sirve.", "como_se_articula": "Tres tiempos en la misma pantalla: se ve · se cubre · se usa. El material tapado y el que queda a la vista tienen que hablarse. Si al destapar no hay nada que calcular, era memoria de naipes.", "que_no_es": "No es Memory de figuritas. Dos cartas iguales sin valor matemático no entran.", "para_el_aula": "Tocar en la pizarra. Pocas cartas, grandes. El maestro pregunta qué se está guardando: el número, el lugar, o la relación.", "mecanicas": ["RE-1", "MO-1", "EX-3", "PR-2"]}, "juegos": [{"id": "parejas-de-valor", "nombre": "Parejas de valor", "sinopsis": "Se unen dos caras que valen lo mismo con distinta ropa.", "estado": "idea", "archivo": "juegos/memoria/parejas-de-valor.html"}, {"id": "eco-de-cifras", "nombre": "Eco de cifras", "sinopsis": "Una fila se muestra tres segundos. Hay que reconstruirla.", "estado": "idea", "archivo": "juegos/memoria/eco-de-cifras.html"}, {"id": "mesa-tapada", "nombre": "Mesa tapada", "sinopsis": "Se cubren platos. Decir cuántos quedan sin destaparlos todos.", "estado": "idea", "archivo": "juegos/memoria/mesa-tapada.html"}, {"id": "el-orden-que-se-fue", "nombre": "El orden que se fue", "sinopsis": "Se vio una secuencia. Reaparece desordenada. Hay que devolverla.", "estado": "idea", "archivo": "juegos/memoria/el-orden-que-se-fue.html"}, {"id": "dos-vistazos", "nombre": "Dos vistazos", "sinopsis": "Primera mirada: cantidades. Segunda: la pregunta. No hay tercera.", "estado": "idea", "archivo": "juegos/memoria/dos-vistazos.html"}, {"id": "la-caja-de-tres", "nombre": "La caja de tres", "sinopsis": "Solo tres casillas a la vista. Las demás se recuerdan.", "estado": "idea", "archivo": "juegos/memoria/la-caja-de-tres.html"}, {"id": "espejo-tardio", "nombre": "Espejo tardío", "sinopsis": "Lo de la izquierda se tapó. Lo de la derecha pide el complemento.", "estado": "idea", "archivo": "juegos/memoria/espejo-tardio.html"}, {"id": "ruta-borrada", "nombre": "Ruta borrada", "sinopsis": "Un camino se recorrió. Hay que repetirlo de memoria sobre el plano.", "estado": "idea", "archivo": "juegos/memoria/ruta-borrada.html"}, {"id": "fichas-que-caminan", "nombre": "Fichas que caminan", "sinopsis": "Se movieron dos. Decir cuáles, sin haberlas seguido con el dedo.", "estado": "idea", "archivo": "juegos/memoria/fichas-que-caminan.html"}, {"id": "el-total-escondido", "nombre": "El total escondido", "sinopsis": "Se vieron partes. El total se pide cuando ya no están.", "estado": "idea", "archivo": "juegos/memoria/el-total-escondido.html"}, {"id": "memoria-de-lugar", "nombre": "Memoria de lugar", "sinopsis": "Cada cantidad vivía en un sitio. El sitio se vació.", "estado": "idea", "archivo": "juegos/memoria/memoria-de-lugar.html"}, {"id": "la-carta-testigo", "nombre": "La carta testigo", "sinopsis": "Una carta queda destapada para comparar. Las otras no.", "estado": "idea", "archivo": "juegos/memoria/la-carta-testigo.html"}]}, {"id": "velocidad", "nombre": "Velocidad", "lema": "El pulso sube. Nadie pierde delante de la clase.", "gesto": "Reaccionar contra el reloj", "presion": "reloj", "acento": "#c85f3c", "presentacion": {"que_es": "Un solo criterio ya construido se aplica muchas veces, rápido. El reloj sube. No hay ranking ni nombres. «Jugar otra vez» borra la ronda y no avanza nada.", "como_se_articula": "Se declara el criterio en una frase. Se lanza una ráfaga de ítems cortos. Se cuenta lo acertado, no a quién. Al repetir, cero y burbuja cerrada.", "que_no_es": "No es un examen cronometrado de operaciones peladas. Si el criterio no cabe en una línea, no es velocidad: es desafío.", "para_el_aula": "Toda la clase puede decir en voz baja. Un estudiante toca. Nadie queda último en un tablero.", "mecanicas": ["RE-2", "BU-1", "BU-3", "EL-1"]}, "juegos": [{"id": "rafaga", "nombre": "Ráfaga", "sinopsis": "Doce ítems del mismo criterio. El reloj corre. Se puede repetir.", "estado": "idea", "archivo": "juegos/velocidad/rafaga.html"}, {"id": "pulso-de-tres", "nombre": "Pulso de tres", "sinopsis": "Tres decisiones seguidas. Si una falla, la ráfaga se reinicia.", "estado": "idea", "archivo": "juegos/velocidad/pulso-de-tres.html"}, {"id": "acepta-o-sigue", "nombre": "Acepta o sigue", "sinopsis": "Pasa lo que cumple. Descarta lo que no. El gesto es contenerse.", "estado": "idea", "archivo": "juegos/velocidad/acepta-o-sigue.html"}, {"id": "antes-del-tono", "nombre": "Antes del tono", "sinopsis": "Hay que tocar la cantidad justa antes de se_articula": "Tablero o reserva visible. Cada jugada gasta algo. Las consecuencias se leen en el propio tablero, no en una burbuja. Se puede rehacer el turno.", "que_no_es": "No es ajedrez con números pegados. Si no hay dilema (gastar ahora o guardar), es un ejercicio de pasos.", "para_el_aula": "Dos estudiantes proponen planes distintos. Se juega uno. Se compara con el que no se jugó.", "mecanicas": ["EL-2", "RE-3", "PR-4", "MA-4"]}, "juegos": [{"id": "el-colmado-justo", "nombre": "El colmado justo", "sinopsis": "Comprar con una reserva. Cada producto cambia lo que queda.", "estado": "idea", "archivo": "juegos/estrategia/el-colmado-justo.html"}, {"id": "cercar-el-numero", "nombre": "Cercar el número", "sinopsis": "Ir cerrando un intervalo. Cada ficha gasta un movimiento.", "estado": "idea", "archivo": "juegos/estrategia/cercar-el-numero.html"}, {"id": "dos-caminos", "nombre": "Dos caminos", "sinopsis": "Llegar al mismo total por rutas que no cuestan igual.", "estado": "idea", "archivo": "juegos/estrategia/dos-caminos.html"}, {"id": "guardar-o-usar", "nombre": "Guardar o usar", "sinopsis": "Una ficha potente. Gastarla ahora cierra un atajo y abre un hueco.", "estado": "idea", "archivo": "juegos/estrategia/guardar-o-usar.html"}, {"id": "el-reparto-tenso", "nombre": "El reparto tenso", "sinopsis": "Partir una cantidad entre tres destinos que no se pueden quedar cortos.", "estado": "idea", "archivo": "juegos/estrategia/el-reparto-tenso.html"}, {"id": "bloquear-la-casilla", "nombre": "Bloquear la casilla", "sinopsis": "Ocupar para que el otro plan ya no quepa.", "estado": "idea", "archivo": "juegos/estrategia/bloquear-la-casilla.html"}, {"id": "tres-turnos", "nombre": "Tres turnos", "sinopsis": "Solo tres jugadas. Hay que dejar el tablero en la meta.", "estado": "idea", "archivo": "juegos/estrategia/tres-turnos.html"}, {"id": "la-reserva-ciega", "nombre": "La reserva ciega", "sinopsis": "Se ve lo que hay, no lo que vendrá. Hay que dejar margen.", "estado": "idea", "arc       const raw = (hash || location.hash || "#inicio").replace(/^#/, "");
      const [a, b, c] = raw.split("/").map(decodeURIComponent);
      if (!a || a === "inicio") return { vista:"inicio" };
      if (a === "salas") return { vista:"salas" };
      if (a === "catalogo") return { vista:"catalogo" };
      if (a === "orientador") return { vista:"orientador" };
      if (a === "sala") return DataRepository.zona(b) ? { vista:"sala", zonaId:b } : { vista:"inicio", aviso:"Esa sala no está en la plataforma." };
      if (a === "juego") return (DataRepository.zona(b) && DataRepository.juego(b, c)) ? { vista:"ficha", zonaId:b, juegoId:c } : { vista:"inicio", aviso:"Ese juego no está en el catálogo." };
      return { vista:"inicio", aviso:"Esa dirección no corresponde a ninguna sección." };
    },
    hash(){ return location.hash || "#inicio"; },
    go(hash, opts){
      opts = opts || {};
      Focus.guardar();
      const modo = opts.volver ? "atras" : "adelante";
      if (this.hash() !== hash){
        history.pushState(null, "", hash);
        if (opts.volver){
          const i = State.pila.lastIndexOf(hash);
          if (i >= 0) State.pila = State.pila.slice(0, i + 1);
        } else State.pila.push(hash);
      }
      View.transicion(modo);
    }
  };

  function anunciar(t){ document.getElementById("aviso").textContent = t; }
  function syncNav(vista){
    const mapa = { inicio:"nav-inicio", salas:"nav-salas", sala:"nav-salas", ficha:"nav-salas", catalogo:"nav-catalogo", orientador:"nav-orientador" };
    document.querySelectorAll(".nav a").forEach(a => a.removeAttribute("aria-current"));
    const id = mapa[vista];
    if (id) document.getElementById(id).setAttribute("aria-current", "page");
  }

  const Views = {
    inicio(r){
      const aviso = r.aviso ? '<p class="aviso" role="status">' + esc(r.aviso) + "</p>" : "";

        const n = String(i + 1).padStart(2, "0");
        return '<li style="--i:' + i + '"><a id="atajo-' + z.id + '" data-go="#sala/' + z.id + '" href="#sala/' + z.id + '"><span class="n">' + n + '</span><strong>' + esc(z.nombre) + '</strong></a></li>';

      return '<section class="portada"><div class="entrada"><h1>Diez salas, un gesto cada una.</h1><p class="bajada">Aquí se organizan los juegos de matemática escolar. Cada sala pide una forma distinta de actuar. El catálogo crece por salas, no como una lista suelta.</p><div class="acciones"><a class="btn-primario" data-go="#salas" href="#salas">Explorar salas</a><a class="btn btn-ghost" data-go="#catalogo" href="#catalogo">Abrir catálogo</a><a class="btn btn-ghost" data-go="#orientador" href="#orientador">Usar el orientador</a></div>' + aviso + '</div><section class="escena-salas" aria-label="Las diez salas"><h2>Las salas</h2><ol class="indice">' + indice + '</ol></section></section><article class="destacado"><div class="lectura"><h2>' + esc(listo.juego.nombre) + '</h2><p>' + esc(listo.juego.sinopsis) + '</p><div class="fila-acc"><a class="accion" href="' + esc(listo.juego.archivo) + '">Abrir juego</a><button type="button" class="btn-sec" id="ficha-ahora" data-go="#juego/' + listo.zona.id + '/' + listo.juego.id + '" style="color:var(--te-hondo);border-color:var(--borde-calido)">Ver ficha</button></div></div>' + dominos + '</article>';
    },
    salas(){

        return '<button type="button" class="sala-btn m-' + z.id + '" data-sala="' + z.id + '" id="sala-' + z.id + '" data-go="#sala/' + z.id + '" style="--marca:' + z.acento + ';animation-delay:' + Math.min(i, 12) * 45 + 'ms"><span class="marca-sala">' + MARCAS[z.id] + '</span><span><span class="n">' + n + '</span><h2>' + esc(z.nombre) + '</h2><p class="lema">' + esc(z.lema) + '</p><p class="gesto">' + esc(z.gesto) + '</p></span><span class="pie"><span class="cue">Entrar</span></span></button>';
      }).join("");
      return '<section><p class="kicker">Salas</p><h1>Diez lógicas de juego</h1><p class="bajada">El orden va del 1 al 10. Cada sala conserva su gesto. Entra en una para ver sus juegos.</p></section><div class="mosaico" style="margin-top:24px">' + cards + '</div>';
    },
    sala(id){

      const bloques = [["que","Qué es", z.presentacion.que_es],["como","Cómo funciona", z.presentacion.como_se_articula],["no","Qué no es", z.presentacion.que_no_es],["aula","En el aula", z.presentacion.para_el_aula]];
      const tabs = bloques.map((b, i) => '<button type="button" role="tab" id="tab-' + b[0] + '" aria-controls="panel-' + b[0] + '" aria-selected="' + (i ? "false" : "true") + '" tabindex="' + (i ? "-1" : "0") + '">' + b[1] + '</button>').join("");
      const panels = bloques.map((b, i) => '<div role="tabpanel" class="lectura panel" id="panel-' + b[0] + '" aria-labelledby="tab-' + b[0] + '"' + (i ? " hidden" : "") + '><p>' + esc(b[2]) + '</p></div>').join("");
      const juegos = z.juegos.map(j => tarjetaJuego(z, j)).join("");
      return '<article class="cabeza-sala" style="--halo:' + z.acento + '"><button type="button" class="volver" id="volver-salas" data-go="#salas" data-volver="1">Volver a las salas</button><p class="kicker">' + n + '</p><div class="sala-hero">' + MARCAS[z.id] + '<h1>' + esc(z.nombre) + '</h1></div><p class="bajada">' + esc(z.lema) + '</p><p class="meta">' + esc(z.gesto) + '.</p></article><div class="layout-sala"><div><h2>Juegos</h2><ul class="catalogo">' + juegos + '</ul></div><div class="pedagogia"><div class="tabs" role="tablist" aria-label="Información de la sala">' + tabs + '</div>' + panels + '</div></div>';
    },
    ficha(zid, jid){
      const z = DataRepository.zona(zid);
      const j = DataRepository.juego(zid, jid);
      const listo = j.estado === "listo";
      const cuerpo = listo
        ? '<p class="sinopsis">' + esc(j.sinopsis) + '</p><p class="estado">Disponible. El juego abre en su propia página.</p><div class="fila-acc"><a class="accion" href="' + esc(j.archivo) + '">Abrir juego</a></div>'
        : '<p class="sinopsis">' + esc(j.sinopsis) + '</p><p class="estado">En desarrollo. Todavía no se puede abrir.</p>';
      return '<article class="ficha"><button type="button" class="volver" id="volver-sala" data-go="#sala/' + z.id + '" data-volver="1">Volver a ' + esc(z.nombre) + '</button><div class="ficha-escena" style="--marca:' + z.acento + '"><p class="kicker">' + esc(z.nombre) + '</p><div class="sala-hero">' + MARCAS[z.id] + '<h1>' + esc(j.nombre) + '</h1></div><div class="lectura panel">' + cuerpo + '<p class="estado" style="margin-top:12px">Esta ficha pertenece a la sala ' + esc(z.nombre) + '. ' + esc(z.lema) + '</p></div></div></article>';
    },
    catalogo(){
      const salas = DataRepository.zonas().map(z => '<option value="' + z.id + '">' + esc(z.nombre) + '</option>').join("");
      return '<section><p class="kicker">Catálogo</p><h1>Todos los juegos</h1><p class="bajada">Busca por nombre o por lo que dice la sinopsis. Filtra por sala o por lo que ya se puede abrir.</p></section><form class="filtros" id="form-catalogo" style="margin-top:24px" role="search"><div class="campo"><label for="buscar">Buscar</label><input id="buscar" type="search" autocomplete="off" value="' + esc(State.catalogo.q) + '"></div><div class="campo"><label for="filtro-sala">Sala</label><select id="filtro-sala"><option value="">Todas las salas</option>' + salas + '</select></div><div class="campo"><label for="filtro-estado">Disponibilidad</label><select id="filtro-estado"><option value="">Todas</option><option value="listo">Disponibles</option><option value="idea">En desarrollo</option></select></div><button type="button" class="btn-sec" id="limpiar" style="color:var(--crema);border-color:rgba(247,241,233,.28)">Limpiar filtros</button></form><p class="cuenta" id="cuenta" aria-live="polite"></p><ul class="lista" id="lista-juegos"></ul><div class="papel vacio" id="vacio" hidden><p>Ningún juego coincide. Prueba otro nombre o limpia los filtros.</p><div class="fila-acc" style="margin-top:12px"><button type="button" class="btn-sec" id="limpiar-vacio">Limpiar filtros</button></div></div>';
    },
    orientador(){
      const campos = [["gesto","Gesto","La acción que hace el estudiante."],["presion","Presión","El pulso de la ronda."],["azar","Azar","Si el azar se ve, se esconde o no entra."],["producto","Producto","Lo que queda al terminar."],["social","Social","Quién actúa delante de la clase."],["capa","Capa matemática","El tipo de contenido que se pone en juego."]];
      let guardado = State.aparato;
      try { if (!guardado) guardado = JSON.parse(sessionStorage.getItem("s321-orientador") || "null"); } catch (e) { guardado = null; }
      const ejes = campos.map(([k, lab, ayuda]) => {
        const opts = DataRepository.ejes()[k].map(([v, n]) => '<option value="' + esc(v) + '"' + (guardado && guardado[k] === v ? " selected" : "") + '>' + esc(n) + '</option>').join("");
        return '<div class="campo eje"><label for="eje-' + k + '">' + lab + '</label><select id="eje-' + k + '">' + opts + '</select><p class="nota">' + ayuda + '</p></div>';
      }).join("");
      return '<section class="entrada"><p class="kicker">Orientador</p><h1>Encontrar la sala</h1><p class="bajada">Seis ejes para localizar la lógica dominante. No es una clasificación cerrada: una propuesta puede compartir rasgos con más de una sala.</p></section><div class="ejes">' + ejes + '</div><div class="lectura resultado" id="salida" aria-live="polite"></div>';
    }
  };

  function tarjetaJuego(z, j){
    const listo = j.estado === "listo";
    const acciones = listo
      ? '<a class="accion" href="' + esc(j.archivo) + '">Abrir juego</a><button type="button" class="btn-sec" id="concepto-' + z.id + '-' + j.id + '" data-go="#juego/' + z.id + '/' + j.id + '">Ver ficha</button>'
      : '<button type="button" class="btn-sec" id="concepto-' + z.id + '-' + j.id + '" data-go="#juego/' + z.id + '/' + j.id + '">Ver concepto</button>';
    return '<li class="' + (listo ? "listo" : "previsto") + '" style="--marca:' + z.acento + '"><p class="estado">' + esc(z.nombre) + '</p><h3>' + esc(j.nombre) + '</h3><p class="sinopsis">' + esc(j.sinopsis) + '</p><p class="estado">' + (listo ? "Disponible" : "En desarrollo") + '</p><div class="fila-acc">' + acciones + '</div></li>';
  }

  const Catalog = {
    items: [],
    mount(){
      const selS = document.getElementById("filtro-sala");
      const selE = document.getElementById("filtro-estado");
      if (selS) selS.value = State.catalogo.sala;
      if (selE) selE.value = State.catalogo.disp;
      const lista = document.getElementById("lista-juegos");
      this.items = DataRepository.todos();
      lista.innerHTML = this.items.map(x => tarjetaJuego(x.zona, x.juego)).join("");
      this.apply(false);
    },
    apply(anuncia){
      const q = plano(State.catalogo.q);
      const sala = State.catalogo.sala;
      const disp = State.catalogo.disp;
      const lis = document.querySelectorAll("#lista-juegos li");
      let n = 0;
      this.items.forEach((x, i) => {
        const texto = plano(x.juego.nombre + " " + x.juego.sinopsis);
        const ok = (!q || texto.includes(q)) && (!sala || x.zona.id === sala) && (!disp || x.juego.estado === disp);
        lis[i].hidden = !ok;
        if (ok) n++;
      });
      const cuenta = document.getElementById("cuenta");
      const vacio = document.getElementById("vacio");
      const frase = n === 1 ? "1 juego" : n + " juegos";
      if (cuenta) cuenta.textContent = frase;
      if (vacio) vacio.hidden = n !== 0;
      const lista = document.getElementById("lista-juegos");
      if (lista) lista.hidden = n === 0;
      if (anuncia && cuenta) anunciar(frase);
    },
    schedule(){
      clearTimeout(State.timer);
      State.timer = setTimeout(() => {
        State.catalogo.q = document.getElementById("buscar").value;
        this.apply(true);
      }, 200);
    },
    limpiar(){
      State.catalogo = { q:"", sala:"", disp:"", orden:"sala" };
      const b = document.getElementById("buscar");
      if (b) b.value = "";
      document.getElementById("filtro-sala").value = "";
      document.getElementById("filtro-estado").value = "";
      this.apply(true);
      b.focus();
    }
  };

  function orientar(sel){
    let id = "desafio";
    if (sel.azar === "visible" || sel.capa === "incertidumbre") id = "probabilidad";
    else if (sel.presion === "reloj") id = "velocidad";
    else if (sel.gesto === "retener") id = "memoria";
    else if (sel.azar === "oculto" || sel.gesto === "manipular" || sel.capa === "cambio") id = "construccion";
    else if (sel.gesto === "organizar" || sel.capa === "dato" || sel.capa === "relacion") id = "analisis";
    else if (sel.capa === "espacio") id = "tiempo";
    else if (sel.capa === "operacion") id = "calculo";
    else if (sel.gesto === "buscar") id = "concentracion";
    else if (sel.producto === "pronostico" || sel.social === "turno") id = "estrategia";
    return { zona: DataRepository.zona(id), porque: PORQUE[id] };
  }
  const Orientation = {
    leer(){
      const sel = {};
      ["gesto","presion","azar","producto","social","capa"].forEach(k => { sel[k] = document.getElementById("eje-" + k).value; });
      State.aparato = sel;
      try { sessionStorage.setItem("s321-orientador", JSON.stringify(sel)); } catch (e) {}
      const r = orientar(sel);
      const z = r.zona;
      document.getElementById("salida").innerHTML = '<p class="kicker">Orientación</p><div class="sala-hero">' + MARCAS[z.id] + '<h2>' + esc(z.nombre) + '</h2></div><p>' + esc(z.lema) + '</p><p class="estado">' + esc(r.porque) + '</p><div class="receta">' + esc(RECETA[z.id]) + '</div><button type="button" class="btn-primario" data-go="#sala/' + z.id + '">Abrir sala ' + esc(z.nombre) + '</button>';
    }
  };

  const Pantalla = {
    activa(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); },
    async set(on){
      const raiz = document.documentElement;
      try {
        if (on && !this.activa()){
          const req = raiz.requestFullscreen || raiz.webkitRequestFullscreen;
          if (req) await req.call(raiz);
        } else if (!on && this.activa()){
          const salir = document.exitFullscreen || document.webkitExitFullscreen;
          if (salir) await salir.call(document);
        }
      } catch (e) {}
      this.sync();
    },
    sync(){
      const on = this.activa();
      State.proyeccion = on;
      document.body.classList.toggle("proyeccion", on);
      const b = document.getElementById("btnProyeccion");
      b.setAttribute("aria-pressed", on ? "true" : "false");
      b.setAttribute("aria-label", on ? "Salir de pantalla completa" : "Pantalla completa");
    }
  };

  const View = {
    pintar(modo){
      const r = Router.parse();
      const lienzo = document.getElementById("lienzo");
      let html = "";
      if (r.vista === "inicio") html = Views.inicio(r);
      else if (r.vista === "salas") html = Views.salas();
      else if (r.vista === "sala") html = Views.sala(r.zonaId);
      else if (r.vista === "ficha") html = Views.ficha(r.zonaId, r.juegoId);
      else if (r.vista === "catalogo") html = Views.catalogo();
      else html = Views.orientador();
      document.body.dataset.vista = r.vista;
      if (r.zonaId){
        const zona = DataRepository.zona(r.zonaId);
        if (zona) document.body.style.setProperty("--halo", zona.acento);
      }
      lienzo.innerHTML = html;
      lienzo.classList.toggle("entra", modo !== "atras" && !document.startViewTransition);
      if (r.vista === "catalogo") Catalog.mount();
      if (r.vista === "orientador") Orientation.leer();
      if (r.vista === "sala") this.tabs();
      syncNav(r.vista);
      const titulo = lienzo.querySelector("h1");
      anunciar(titulo ? titulo.textContent : "Sala de juegos");
      if (modo === "atras"){
        const dest = document.getElementById(Focus.mapa[Router.hash()] || "");
        Focus.poner(dest || titulo);
        window.scrollTo(0, Focus.scroll[Router.hash()] || 0);
      } else {
        window.scrollTo(0, 0);
        Focus.poner(titulo);
      }
    },
    transicion(modo){
      const lienzo = document.getElementById("lienzo");
      const pintar = () => this.pintar(modo);
      if (Motion.reducido() || !lienzo.firstChild){ pintar(); return; }
      if (typeof document.startViewTransition === "function"){
        document.documentElement.dataset.dir = modo;
        document.startViewTransition(() => pintar());
        return;
      }
      lienzo.classList.add("sale");
      setTimeout(() => { pintar(); lienzo.classList.remove("sale"); }, 260);
    },
    tabs(){
      const btns = [...document.querySelectorAll('#lienzo [role="tab"]')];
      function elegir(i, focus){
        btns.forEach((t, k) => {
          const on = k === i;
          t.setAttribute("aria-selected", on ? "true" : "false");
          t.tabIndex = on ? 0 : -1;
          document.getElementById(t.getAttribute("aria-controls")).hidden = !on;
        });
        if (focus) btns[i].focus();
      }
      btns.forEach((t, i) => {
        t.addEventListener("click", () => elegir(i, false));
        t.addEventListener("keydown", (e) => {
          if (!["ArrowRight","ArrowLeft","Home","End"].includes(e.key)) return;
          e.preventDefault();
          let n = i;
          if (e.key === "ArrowRight") n = (i + 1) % btns.length;
          if (e.key === "ArrowLeft") n = (i - 1 + btns.length) % btns.length;
          if (e.key === "Home") n = 0;
          if (e.key === "End") n = btns.length - 1;
          elegir(n, true);
        });
      });
    }
  };

  document.body.addEventListener("pointermove", (e) => {
    const card = e.target.closest(".sala-btn");
    if (!card) return;
    const r = card.getBoundingClientRect();
    const escala = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--escala")) || 1;
    card.style.setProperty("--mx", ((e.clientX - r.left) / escala) + "px");
    card.style.setProperty("--my", ((e.clientY - r.top) / escala) + "px");
  });
  document.body.addEventListener("click", (e) => {
    const limpiar = e.target.closest("#limpiar, #limpiar-vacio");
    if (limpiar){ e.preventDefault(); Catalog.limpiar(); return; }
    const go = e.target.closest("[data-go]");
    if (!go) return;
    if (e.target.closest("a.accion")) return;
    e.preventDefault();
    Router.go(go.getAttribute("data-go"), { volver: go.hasAttribute("data-volver") });
  });
  document.body.addEventListener("input", (e) => {
    if (e.target.id === "buscar") Catalog.schedule();
  });
  document.body.addEventListener("change", (e) => {
    if (e.target.id === "filtro-sala" || e.target.id === "filtro-estado"){
      State.catalogo.sala = document.getElementById("filtro-sala").value;
      State.catalogo.disp = document.getElementById("filtro-estado").value;
      Catalog.apply(true);
    }
    if (e.target.id && e.target.id.indexOf("eje-") === 0) Orientation.leer();
  });
  document.getElementById("btnProyeccion").addEventListener("click", () => Pantalla.set(!Pantalla.activa()));
  document.addEventListener("fullscreenchange", () => { Pantalla.sync(); pedirEscala(); });
  document.addEventListener("webkitfullscreenchange", () => { Pantalla.sync(); pedirEscala(); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && Pantalla.activa()) document.getElementById("btnProyeccion").focus();
  });
  window.addEventListener("popstate", () => {
    const h = Router.hash();
    const i = State.pila.lastIndexOf(h);
    const atras = i >= 0 && i < State.pila.length - 1;
    if (atras) State.pila = State.pila.slice(0, i + 1);
    else if (State.pila[State.pila.length - 1] !== h) State.pila.push(h);
    View.transicion(atras ? "atras" : "adelante");
  });

  const data = DataRepository.load();
  const errores = DataValidator.run(data);
  if (errores.length){
    document.getElementById("lienzo").innerHTML = '<h1>El catálogo no se pudo abrir</h1><p class="aviso">' + esc(errores[0]) + '</p>';
  } else if (!location.hash){
    history.replaceState(null, "", "#inicio");
    View.pintar("adelante");
  } else {
    View.pintar("adelante");
  }
  const Escenario = {
    aplicar(){
      const vv = window.visualViewport;
      const ancho = vv ? vv.width : window.innerWidth;
      const alto = vv ? vv.height : window.innerHeight;
      const razon = alto > 0 ? ancho / alto : 1;
      let marco = "telefono";
      if (razon >= 2) marco = "cine";
      else if (razon >= 1.55) marco = "ancho";
      else if (razon >= 1.15) marco = "tabla";
      else if (razon >= 0.72) marco = "retrato";
      document.body.dataset.marco = marco;
      document.documentElement.style.setProperty("--escala", "1");
    }
  };
  let marcoTimer = 0;
  const pedirEscala = () => {
    cancelAnimationFrame(marcoTimer);
    marcoTimer = requestAnimationFrame(() => Escenario.aplicar());
  };
  document.getElementById("seguir-vertical").addEventListener("click", () => {
    Escenario.aplicar();
  });
