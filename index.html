<style>
:root{
  --pe-hondo:#0f2d3a; --pe-base:#173f50; --pe-caja:#2a4e5e; --pe-claro:#2c5c70;
  --te-hondo:#8f3a1e; --te-base:#b04a2a; --te-caja:#b55537; --te-vivo:#c85f3c; --te-sil:#e4c5b5;
  --ci-hondo:#462d40; --ci-base:#5a3a52;
  --lienzo:#f7f1e9; --papel:#fffcf7; --tinta:#1b1512; --tinta-m:#2e2622; --tinta-t:#4a3f38;
  --suelo:#102833;
  --lora:'Lora',Georgia,'Times New Roman',serif;
  --nunito:'Nunito',system-ui,sans-serif;
  --mono:'Source Code Pro','Courier New',monospace;
  --radio:22px; --ease:cubic-bezier(.22,.68,0,1.08);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--suelo);color:var(--papel);font-family:var(--nunito);}
body{min-height:100dvh;overflow:auto;}
#fondo{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(900px 500px at 12% -10%, rgba(200,95,60,.22), transparent 55%),
  radial-gradient(700px 480px at 92% 8%, rgba(90,58,82,.28), transparent 50%),
  linear-gradient(165deg,#0c2430 0%, #173f50 55%, #102833 100%);}
#app{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column;padding:18px 22px 0;}
header.top{display:flex;align-items:center;gap:16px;flex:0 0 auto;flex-wrap:wrap;}
.iso{width:44px;height:44px;flex:0 0 auto;}
.brand h1{margin:0;font-family:var(--lora);font-weight:600;font-size:clamp(1.35rem,2.2vw,1.85rem);color:#f7f1e9;}
.brand p{margin:0;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:#e4c5b5;font-weight:700;}
nav.switch{margin-left:auto;display:flex;background:rgba(15,45,58,.55);border:1px solid rgba(228,197,181,.22);border-radius:999px;padding:4px;gap:4px;}
nav.switch button{appearance:none;border:0;background:transparent;color:#f2e2dc;font:700 .82rem var(--nunito);padding:10px 18px;border-radius:999px;cursor:pointer;}
nav.switch button[aria-pressed="true"]{background:#b04a2a;color:#fff;}
.credito{margin-left:12px;font-size:.72rem;color:#e4c5b5;font-weight:700;}
main{flex:1 1 auto;margin-top:18px;}
.vista{display:none;}
.vista.activa{display:block;}
.sala-intro{max-width:860px;margin:0 0 18px;}
.sala-intro h2{font-family:var(--lora);font-size:clamp(1.5rem,2.6vw,2.2rem);margin:0 0 8px;font-weight:600;}
.sala-intro p{margin:0;color:#f2e2dc;font-weight:650;line-height:1.45;}
.rejilla{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;}
@media (max-width:1180px){.rejilla{grid-template-columns:repeat(3,minmax(0,1fr));}}
@media (max-width:760px){.rejilla{grid-template-columns:repeat(2,minmax(0,1fr));}}
.zona-tile{min-height:220px;display:flex;flex-direction:column;border:0;border-radius:var(--radio);padding:18px;text-align:left;cursor:pointer;color:#fff;
  background:linear-gradient(165deg, rgba(255,252,247,.08), rgba(15,45,58,.35));
  box-shadow:0 18px 40px rgba(0,0,0,.28);border:1px solid rgba(242,226,220,.14);}
.zona-tile .n{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:#e4c5b5;font-weight:700;}
.zona-tile h3{margin:12px 0 8px;font-family:var(--lora);font-size:1.42rem;font-weight:600;}
.zona-tile .lema{margin:0;color:#f2e2dc;font-weight:650;font-size:.92rem;line-height:1.35;flex:1;}
.zona-tile .pie{margin-top:14px;display:flex;justify-content:space-between;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:#e4c5b5;font-weight:800;}
.barra{height:3px;width:42%;background:var(--z-acento,#b04a2a);border-radius:99px;margin-top:10px;}
.aparato{display:grid;grid-template-columns:1.15fr .85fr;gap:20px;}
@media (max-width:980px){.aparato{grid-template-columns:1fr;}}
.maquina,.salida{background:rgba(255,252,247,.06);border:1px solid rgba(242,226,220,.16);border-radius:28px;padding:22px 24px;}
.maquina h2,.salida h3{font-family:var(--lora);margin:0 0 8px;}
.ejes{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.eje label{display:block;font-family:var(--mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:#e4c5b5;margin-bottom:6px;}
.eje select{width:100%;background:#0f2d3a;color:#f7f1e9;border:1px solid rgba(228,197,181,.28);border-radius:14px;padding:11px 14px;font:700 .95rem var(--nunito);}
.salida .badge{display:inline-block;background:var(--te-base);color:#fff;border-radius:999px;padding:6px 14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:.72rem;}
.salida .receta{background:rgba(15,45,58,.55);border-left:6px solid #b04a2a;border-radius:14px;padding:14px 16px;font-weight:700;}
.salida button.ir,.juego a.ir{margin-top:12px;display:inline-block;background:#b04a2a;color:#fff;border:0;border-radius:14px;padding:12px 18px;font:800 .95rem var(--nunito);text-decoration:none;cursor:pointer;}
.zona-view{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:20px;}
@media (max-width:980px){.zona-view{grid-template-columns:1fr;}}
.presenta{background:rgba(255,252,247,.07);border:1px solid rgba(242,226,220,.16);border-radius:28px;padding:22px;}
.presenta button.back{background:transparent;border:0;color:#e4c5b5;font:800 .8rem var(--nunito);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;padding:0 0 12px;}
.presenta h2{font-family:var(--lora);margin:0 0 6px;font-size:2rem;}
.kicker{font-family:var(--mono);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:#e4c5b5;font-weight:700;}
.presenta h4{margin:16px 0 4px;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:#e4c5b5;}
.presenta p{margin:0;font-weight:650;line-height:1.4;}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.chip{background:rgba(15,45,58,.6);border:1px solid rgba(228,197,181,.25);border-radius:999px;padding:4px 10px;font-family:var(--mono);font-size:.72rem;}
.lista{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
@media (max-width:760px){.lista{grid-template-columns:1fr;}}
.juego{background:var(--papel);color:var(--tinta);border-radius:20px;padding:16px;border:1px solid rgba(15,45,58,.08);text-align:left;cursor:pointer;}
.juego .est{font-family:var(--mono);font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;color:var(--te-hondo);font-weight:700;}
.juego h3{margin:6px 0;font-family:var(--lora);font-size:1.15rem;color:var(--pe-hondo);}
.juego p{margin:0;font-weight:700;color:var(--tinta-m);font-size:.9rem;}
.juego .ruta{margin-top:10px;font-family:var(--mono);font-size:.68rem;color:var(--tinta-t);}
.ficha-box{background:var(--papel);color:var(--tinta);border-radius:28px;padding:28px;max-width:720px;margin:4vh auto 8vh;}
.ficha-box h2{font-family:var(--lora);color:var(--pe-hondo);}
footer.pie{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:20px;padding:14px 0 16px;border-top:1px solid rgba(228,197,181,.2);color:#e4c5b5;font-size:.75rem;font-weight:700;}
footer.pie a{color:#e4c5b5;}
</style>
</head>

      <rect x="34" y="44.6" width="8.4" height="8.4" rx="2.4" fill="#e4c5b5"/>

<script>
const DATA = {"zonas":[{"id":"desafio","nombre":"Desafío","lema":"La dificultad sube. El reloj no manda.","gesto":"Producir y decidir con exigencia creciente","presion":"calma-exigente","acento":"#b04a2a","presentacion":{"que_es":"Una ronda vale si el siguiente peldaño pide más que el anterior: más cifras, una condición nueva, o un camino que ya no se puede resolver de un golpe de vista.","como_se_articula":"Se fija un criterio único. Se construyen diez peldaños. Cada peldaño cambia una sola variable. El estudiante ve el peldaño, resuelve, y solo entonces aparece el siguiente. No hay ranking. Hay umbral.","que_no_es":"No es una lista de ejercicios con confeti. Si el gesto no cambia de exigencia, es cálculo disfrazado.","para_el_aula":"En PDI, un estudiante resuelve el peldaño a la vista. El resto pronostica si va a alcanzar. El maestro señala el criterio, no la cuenta.","mecanicas":["PR-2","PR-3","EL-2","BU-1"]},"juegos":[{"id":"tres-condiciones","nombre":"Tres condiciones","sinopsis":"Cada grupo de casillas cumple una condición. Las fichas de dominó no se solapan.","estado":"listo","archivo":"desafio/tres-condiciones/tres-condiciones.html"}]},{"id":"memoria","nombre":"Memoria","lema":"Lo que se tapó sigue contando.","gesto":"Retener y emparejar","presion":"calma","acento":"#5a3a52","presentacion":{"que_es":"Se muestra, se tapa, se pide. La matemática no está en recordar dibujos: está en recordar una cantidad, una relación o una posición que todavía sirve.","como_se_articula":"Tres tiempos en la misma pantalla: se ve · se cubre · se usa. El material tapado y el que queda a la vista tienen que hablarse. Si al destapar no hay nada que calcular, era memoria de naipes.","que_no_es":"No es Memory de figuritas. Dos cartas iguales sin valor matemático no entran.","para_el_aula":"Tocar en la pizarra. Pocas cartas, grandes. El maestro pregunta qué se está guardando: el número, el lugar, o la relación.","mecanicas":["RE-1","MO-1","EX-3","PR-2"]},"juegos":[{"id":"parejas-de-valor","nombre":"Parejas de valor","sinopsis":"Se unen dos caras que valen lo mismo con distinta ropa.","estado":"idea","archivo":"memoria/parejas-de-valor/parejas-de-valor.html"},{"id":"eco-de-cifras","nombre":"Eco de cifras","sinopsis":"Una fila se muestra tres segundos. Hay que reconstruirla.","estado":"idea","archivo":"memoria/eco-de-cifras/eco-de-cifras.html"},{"id":"mesa-tapada","nombre":"Mesa tapada","sinopsis":"Se cubren platos. Decir cuántos quedan sin destaparlos todos.","estado":"idea","archivo":"memoria/mesa-tapada/mesa-tapada.html"},{"id":"el-orden-que-se-fue","nombre":"El orden que se fue","sinopsis":"Se vio una secuencia. Reaparece desordenada. Hay que devolverla.","estado":"idea","archivo":"memoria/el-orden-que-se-fue/el-orden-que-se-fue.html"},{"id":"dos-vistazos","nombre":"Dos vistazos","sinopsis":"Primera mirada: cantidades. Segunda: la pregunta. No hay tercera.","estado":"idea","archivo":"memoria/dos-vistazos/dos-vistazos.html"},{"id":"la-caja-de-tres","nombre":"La caja de tres","sinopsis":"Solo tres casillas a la vista. Las demás se recuerdan.","estado":"idea","archivo":"memoria/la-caja-de-tres/la-caja-de-tres.html"},{"id":"espejo-tardio","nombre":"Espejo tardío","sinopsis":"Lo de la izquierda se tapó. Lo de la derecha pide el complemento.","estado":"idea","archivo":"memoria/espejo-tardio/espejo-tardio.html"},{"id":"ruta-borrada","nombre":"Ruta borrada","sinopsis":"Un camino se recorrió. Hay que repetirlo de memoria sobre el plano.","estado":"idea","archivo":"memoria/ruta-borrada/ruta-borrada.html"},{"id":"fichas-que-caminan","nombre":"Fichas que caminan","sinopsis":"Se movieron dos. Decir cuáles, sin haberlas seguido con el dedo.","estado":"idea","archivo":"memoria/fichas-que-caminan/fichas-que-caminan.html"},{"id":"el-total-escondido","nombre":"El total escondido","sinopsis":"Se vieron partes. El total se pide cuando ya no están.","estado":"idea","archivo":"memoria/el-total-escondido/el-total-escondido.html"},{"id":"memoria-de-lugar","nombre":"Memoria de lugar","sinopsis":"Cada cantidad vivía en un sitio. El sitio se vació.","estado":"idea","archivo":"memoria/memoria-de-lugar/memoria-de-lugar.html"},{"id":"la-carta-testigo","nombre":"La carta testigo","sinopsis":"Una carta queda destapada para comparar. Las otras no.","estado":"idea","archivo":"memoria/la-carta-testigo/la-carta-testigo.html"}]},{"id":"velocidad","nombre":"Velocidad","lema":"El pulso sube. Nadie pierde delante de la clase.","gesto":"Reaccionar contra el reloj","presion":"reloj","acento":"#c85f3c","presentacion":{"que_es":"Un solo criterio ya construido se aplica muchas veces, rápido. El reloj sube. No hay ranking ni nombres. «Jugar otra vez» borra la ronda y no avanza nada.","como_se_articula":"Se declara el criterio en una frase. Se lanza una ráfaga de ítems cortos. Se cuenta lo acertado, no a quién. Al repetir, cero y burbuja cerrada.","que_no_es":"No es un examen cronometrado de operaciones peladas. Si el criterio no cabe en una línea, no es velocidad: es desafío.","para_el_aula":"Toda la clase puede decir en voz baja. Un estudiante toca. Nadie queda último en un tablero.","mecanicas":["RE-2","BU-1","BU-3","EL-1"]},"juegos":[{"id":"rafaga","nombre":"Ráfaga","sinopsis":"Doce ítems del mismo criterio. El reloj corre. Se puede repetir.","estado":"idea","archivo":"velocidad/rafaga/rafaga.html"},{"id":"pulso-de-tres","nombre":"Pulso de tres","sinopsis":"Tres decisiones seguidas. Si una falla, la ráfaga se reinicia.","estado":"idea","archivo":"velocidad/pulso-de-tres/pulso-de-tres.html"},{"id":"acepta-o-sigue","nombre":"Acepta o sigue","sinopsis":"Pasa lo que cumple. Descarta lo que no. El gesto es contenerse.","estado":"idea","archivo":"velocidad/acepta-o-sigue/acepta-o-sigue.html"},{"id":"antes-del-tono","nombre":"Antes del tono","sinopsis":"Hay que tocar la cantidad justa antes de que suene la marca.","estado":"idea","archivo":"velocidad/antes-del-tono/antes-del-tono.html"},{"id":"la-fila-que-corre","nombre":"La fila que corre","sinopsis":"Números desfilan. Tocar solo los que pertenecen.","estado":"idea","archivo":"velocidad/la-fila-que-corre/la-fila-que-corre.html"},{"id":"doble-toque","nombre":"Doble toque","sinopsis":"Primero la cantidad, luego su pareja, sin pensar el nombre.","estado":"idea","archivo":"velocidad/doble-toque/doble-toque.html"},{"id":"el-atajo","nombre":"El atajo","sinopsis":"Hay una forma corta. Quien la ve tarda menos, no quien aprieta.","estado":"idea","archivo":"velocidad/el-atajo/el-atajo.html"},{"id":"verde-y-sigo","nombre":"Verde y sigo","sinopsis":"Acierto silencioso. Solo se detiene el error.","estado":"idea","archivo":"velocidad/verde-y-sigo/verde-y-sigo.html"},{"id":"mitad-visible","nombre":"Mitad visible","sinopsis":"Se ve una parte. Hay que completar la otra al vuelo.","estado":"idea","archivo":"velocidad/mitad-visible/mitad-visible.html"},{"id":"cambio-de-criterio","nombre":"Cambio de criterio","sinopsis":"A mitad de ráfaga el criterio rota. Lo que valía deja de valer.","estado":"idea","archivo":"velocidad/cambio-de-criterio/cambio-de-criterio.html"},{"id":"diez-en-calma","nombre":"Diez en calma","sinopsis":"Misma ráfaga, pero el reloj solo mira. No apura.","estado":"idea","archivo":"velocidad/diez-en-calma/diez-en-calma.html"},{"id":"el-gesto-unico","nombre":"El gesto único","sinopsis":"Un solo tipo de toque resuelve todo. Nada de menús.","estado":"idea","archivo":"velocidad/el-gesto-unico/el-gesto-unico.html"}]},{"id":"estrategia","nombre":"Estrategia","lema":"El primer movimiento ya decide el tercero.","gesto":"Planear y decidir con consecuencias","presion":"calma","acento":"#173f50","presentacion":{"que_es":"Hay recursos limitados y más de un camino bueno. Se elige, se ve el efecto, se elige otra vez. La matemática está en anticipar, no en el clic verde inmediato.","como_se_articula":"Tablero o reserva visible. Cada jugada gasta algo. Las consecuencias se leen en el propio tablero, no en una burbuja. Se puede rehacer el turno.","que_no_es":"No es ajedrez con números pegados. Si no hay dilema (gastar ahora o guardar), es un ejercicio de pasos.","para_el_aula":"Dos estudiantes proponen planes distintos. Se juega uno. Se compara con el que no se jugó.","mecanicas":["EL-2","RE-3","PR-4","MA-4"]},"juegos":[{"id":"el-colmado-justo","nombre":"El colmado justo","sinopsis":"Comprar con una reserva. Cada producto cambia lo que queda.","estado":"idea","archivo":"estrategia/el-colmado-justo/el-colmado-justo.html"},{"id":"cercar-el-numero","nombre":"Cercar el número","sinopsis":"Ir cerrando un intervalo. Cada ficha gasta un movimiento.","estado":"idea","archivo":"estrategia/cercar-el-numero/cercar-el-numero.html"},{"id":"dos-caminos","nombre":"Dos caminos","sinopsis":"Llegar al mismo total por rutas que no cuestan igual.","estado":"idea","archivo":"estrategia/dos-caminos/dos-caminos.html"},{"id":"guardar-o-usar","nombre":"Guardar o usar","sinopsis":"Una ficha potente. Gastarla ahora cierra un atajo y abre un hueco.","estado":"idea","archivo":"estrategia/guardar-o-usar/guardar-o-usar.html"},{"id":"el-reparto-tenso","nombre":"El reparto tenso","sinopsis":"Partir una cantidad entre tres destinos que no se pueden quedar cortos.","estado":"idea","archivo":"estrategia/el-reparto-tenso/el-reparto-tenso.html"},{"id":"bloquear-la-casilla","nombre":"Bloquear la casilla","sinopsis":"Ocupar para que el otro plan ya no quepa.","estado":"idea","archivo":"estrategia/bloquear-la-casilla/bloquear-la-casilla.html"},{"id":"tres-turnos","nombre":"Tres turnos","sinopsis":"Solo tres jugadas. Hay que dejar el tablero en la meta.","estado":"idea","archivo":"estrategia/tres-turnos/tres-turnos.html"},{"id":"la-reserva-ciega","nombre":"La reserva ciega","sinopsis":"Se ve lo que hay, no lo que vendrá. Hay que dejar margen.","estado":"idea","archivo":"estrategia/la-reserva-ciega/la-reserva-ciega.html"},{"id":"puente-o-orilla","nombre":"Puente o orilla","sinopsis":"Dos zonas. Cruzar cuesta. Quedarse también.","estado":"idea","archivo":"estrategia/puente-o-orilla/puente-o-orilla.html"},{"id":"el-plan-escrito","nombre":"El plan escrito","sinopsis":"Antes de tocar, se declara la secuencia. Luego se ejecuta.","estado":"idea","archivo":"estrategia/el-plan-escrito/el-plan-escrito.html"},{"id":"minimo-de-piezas","nombre":"Mínimo de piezas","sinopsis":"Misma meta con las menos fichas posibles.","estado":"idea","archivo":"estrategia/minimo-de-piezas/minimo-de-piezas.html"},{"id":"el-contraplan","nombre":"El contraplan","sinopsis":"Una ficha rival se mueve sola. Hay que anticiparla.","estado":"idea","archivo":"estrategia/el-contraplan/el-contraplan.html"}]},{"id":"concentracion","nombre":"Concentración","lema":"Nada se toca dos veces. El error se esconde en lo casi igual.","gesto":"Auditar, localizar, descartar","presion":"ritmo","acento":"#2a4e5e","presentacion":{"que_es":"El material está casi bien. Hay que encontrar lo que no cumple, lo que se movió, o lo que se contó dos veces. La atención es el instrumento.","como_se_articula":"Una escena estable. Un cambio mínimo. El estudiante señala. El feedback dice hacia dónde mirar, nunca «no».","que_no_es":"No es sopa de números. Si el ojo no tiene un criterio matemático, es un pasatiempo.","para_el_aula":"Silencio breve. Un dedo en la pizarra. El resto busca el mismo defecto sin hablar.","mecanicas":["BU-2","BU-1","BU-3","EX-4"]},"juegos":[{"id":"la-cifra-impostora","nombre":"La cifra impostora","sinopsis":"Una cantidad no corresponde a su dibujo.","estado":"idea","archivo":"concentracion/la-cifra-impostora/la-cifra-impostora.html"},{"id":"contado-dos-veces","nombre":"Contado dos veces","sinopsis":"Una pieza aparece en dos grupos. El total miente.","estado":"idea","archivo":"concentracion/contado-dos-veces/contado-dos-veces.html"},{"id":"la-fila-que-se-mueve","nombre":"La fila que se mueve","sinopsis":"Entre vistazo y vistazo, una pieza cambió de sitio.","estado":"idea","archivo":"concentracion/la-fila-que-se-mueve/la-fila-que-se-mueve.html"},{"id":"el-criterio-roto","nombre":"El criterio ro traejemplo","nombre":"El contraejemplo","sinopsis":"Proponer un caso que tumbe la regla propuesta.","estado":"idea","archivo":"analisis/el-contraejemplo/el-contraejemplo.html"},{"id":"mapa-de-relaciones","nombre":"Mapa de relaciones","sinopsis":"Unir nodos que se implican. Ninguna flecha de adorno.","estado":"idea","archivo":"analisis/mapa-de-relaciones/mapa-de-relaciones.html"}]},{"id":"construccion","nombre":"Construcción","lema":"Se entra una cantidad. Sale otra. La regla se descubre probando.","gesto":"Manipular el aparato y ensamblar","presion":"calma","acento":"#b55537","presentacion":{"que_es":"Una máquina con entrada visible, proceso y salida. El ciclo entero cabe en una pantalla: se presenta, se prueba libre, se pronostica, se comprueba, se varía.","como_se_articula":"Cinco tiempos juntos. El registro guarda cada ensayo. La regla no se enuncia primero. Se destapa cuando el estudiante ya la sostuvo dos veces.","que_no_es":"No es un botón que calcula. Si no hay prueba libre sin verde ni rojo, no es aparato: es formulario.","para_el_aula":"Un estudiante alimenta. Otro pronostica. El tercero lee el registro. Se rotan.","mecanicas":["MA-2","MA-1","MA-3","MO-5","TR-2"]},"juegos":[{"id":"la-maquina-oculta","nombre":"La máquina oculta","sinopsis":"Entra un número. Sale otro. Descubrir la regla a ensayos.","estado":"idea","archivo":"construccion/la-maquina-oculta/la-maquina-oculta.html"},{"id":"fabrica-de-reglas","nombre":"Fábrica de reglas","sinopsis":"Armar la máquina con piezas (doble, mitad, más tres) y ver qué produce.","estado":"idea","archivo":"construccion/fabrica-de-reglas/fabrica-de-reglas.html"},{"id":"ensamble-a-medida","nombre":"Ensamble a medida","sinopsis":"Construir una figura que cumpla largo, alto y total a la vez.","estado":"idea","archivo":"construccion/ensamble-a-medida/ensamble-a-medida.html"},{"id":"el-comparador","nombre":"El comparador","sinopsis":"Dos salidas lado a lado. Cambiar una entrada y leer el efecto.","estado":"idea","archivo":"construccion/el-comparador/el-comparador.html"},{"id":"laboratorio-abierto","nombre":"Laboratorio abierto","sinopsis":"Tres controles. Ninguna consigna de meta hasta que se pide un pronóstico.","estado":"idea","archivo":"construccion/laboratorio-abierto/laboratorio-abierto.html"},{"id":"la-caja-negra-doble","nombre":"La caja negra doble","sinopsis":"Dos máquinas en serie. La salida de una alimenta la otra.","estado":"idea","archivo":"construccion/la-caja-negra-doble/la-caja-negra-doble.html"},{"id":"testigo-y-maquina","nombre":"Testigo y máquina","sinopsis":"Un conjunto no se toca. El otro pasa por el aparato.","estado":"idea","archivo":"construccion/testigo-y-maquina/testigo-y-maquina.html"},{"id":"construir-el-reto","nombre":"Construir el reto","sinopsis":"El estudiante arma un aparato para el compañero.","estado":"idea","archivo":"construccion/construir-el-reto/construir-el-reto.html"},{"id":"trazo-a-medida","nombre":"Trazo a medida","sinopsis":"Dibujar la longitud pedida. La forma se evalúa.","estado":"idea","archivo":"construccion/trazo-a-medida/trazo-a-medida.html"},{"id":"piezas-que-encajan","nombre":"Piezas que encajan","sinopsis":"Ensamblar para cubrir un contorno sin huecos ni solapes.","estado":"idea","archivo":"construccion/piezas-que-encajan/piezas-que-encajan.html"},{"id":"regla-que-se-invierte","nombre":"Regla que se invierte","sinopsis":"Dada la salida, reconstruir la entrada.","estado":"idea","archivo":"construccion/regla-que-se-invierte/regla-que-se-invierte.html"},{"id":"el-registro-de-ensayos","nombre":"El registro de ensayos","sinopsis":"Cinco pruebas guardadas. Escribir la regla con esas cinco a la vista.","estado":"idea","archivo":"construccion/el-registro-de-ensayos/el-registro-de-ensayos.html"}]}],"ejes":{"gesto":[["elegir","Elegir"],["mover","Mover"],["producir","Producir"],["manipular","Manipular"],["buscar","Buscar"],["retener","Retener"],["organizar","Organizar"]],"presion":[["calma","Calma"],["ritmo","Ritmo"],["reloj","Reloj que sube"]],"azar":[["ninguno","Sin azar"],["visible","Azar a la vista"],["oculto","Regla oculta"]],"producto":[["opcion","Una opción"],["orden","Un orden o un lugar"],["escritura","Una producción"],["pronostico","Un pronóstico"]],"social":[["solo","Un estudiante a la vista"],["turno","Turnos"],["clase","La clase pronostica"]],"capa":[["conteo","Conteo y cantidad"],["operacion","Operación con sentido"],["relacion","Relación y patrón"],["espacio","Espacio y medida"],["dato","Dato y esquema"],["incertidumbre","Incertidumbre"],["cambio","Cambio y máquina"]]}};
const $ = (id) => document.getElementById(id);
function ir(vista){
  document.querySelectorAll('.vista').forEach(v => v.classList.remove('activa'));
  $(vista).classList.add('activa');
  $('tabSala').setAttribute('aria-pressed', vista === 'vista-aparato' ? 'false' : 'true');
  $('tabAparato').setAttribute('aria-pressed', vista === 'vista-aparato' ? 'true' : 'false');
}
function pintarSala(){
  const el = $('vista-sala');
  el.innerHTML = `<div class="sala-intro">
    <h2>Diez zonas. Los juegos se acumulan aquí.</h2>
    <p>Lora en los títulos, Nunito en el cuerpo, Source Code Pro en las cuentas. El gesto largo de cada zona vive dentro de la habitación, no sobre el botón Entrar.</p>
  </div><div class="rejilla"></div>`;
  const grid = el.querySelector('.rejilla');
  DATA.zonas.forEach((z,i)=>{
    const listos = z.juegos.filter(j => j.estado === 'listo').length;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'zona-tile';
    b.style.setProperty('--z-acento', z.acento);
    b.innerHTML = `<span class="n">${i+1} · ${z.juegos.length} semillas${listos ? ' · ' + listos + ' listo' : ''}</span>
      <h3>${z.nombre}</h3>
      <p class="lema">${z.lema}</p>
      <div class="barra"></div>
      <div class="pie"><span>Zona</span><span>Entrar</span></div>`;
    b.addEventListener('click', ()=> pintarZona(z.id));
    grid.appendChild(b);
  });
}
function pintarZona(id){
  const z = DATA.zonas.find(x=>x.id===id);
  const el = $('vista-zona');
  const p = z.presentacion;
  el.innerHTML = `<div class="zona-view">
    <aside class="presenta" style="border-top:6px solid ${z.acento}">
      <button type="button" class="back" id="volerSala">← La sala</button>
      <div class="kicker">Zona ${z.id}</div>
      <h2>${z.nombre}</h2>
      <p style="color:#e4c5b5;margin-bottom:8px">${z.lema}</p>
      <h4>Qué es</h4><p>${p.que_es}</p>
      <h4>Cómo se articula</h4><p>${p.como_se_articula}</p>
      <h4>Qué no es</h4><p>${p.que_no_es}</p>
      <h4>En el aula</h4><p>${p.para_el_aula}</p>
      <h4>Mecánicas de casa</h4>
      <div class="chips">${p.mecanicas.map(m=>`<span class="chip">${m}</span>`).join('')}</div>
    </aside>
    <div class="lista"></div>
  </div>`;
  const lista = el.querySelector('.lista');
  z.juegos.forEach(j=>{
    const c = document.createElement('button');
    c.type='button';
    c.className='juego';
    c.innerHTML = `<span class="est">${j.estado}</span>
      <h3>${j.nombre}</h3>
      <p>${j.sinopsis}</p>
      <div class="ruta">${j.archivo}</div>`;
    c.addEventListener('click', ()=> pintarFicha(z,j));
    lista.appendChild(c);
  });
  $('volerSala').addEventListener('click', ()=>{ pintarSala(); ir('vista-sala'); });
  ir('vista-zona');
}
function pintarFicha(z,j){
  const el = $('vista-ficha');
  const entra = j.estado === 'listo'
    ? `<p><a class="ir" href="${j.archivo}">Entrar al juego</a></p>`
    : `<p>Aún es semilla. Cuando lo pidas, se construye en esa ruta.</p>`;
  el.innerHTML = `<article class="ficha-box">
    <button type="button" class="back" id="volerZona" style="background:none;border:0;color:#8f3a1e;font:800 .8rem var(--nunito);letter-spacing:.1em;text-transform:uppercase;cursor:pointer">← ${z.nombre}</button>
    <div class="kicker" style="color:#8f3a1e">${z.nombre} · ${j.estado}</div>
    <h2>${j.nombre}</h2>
    <p>${j.sinopsis}</p>
    ${entra}
    <p class="ruta" style="font-family:var(--mono);background:#ece3d7;padding:8px 12px;border-radius:10px">${j.archivo}</p>
  </article>`;
  $('volerZona').addEventListener('click', ()=> pintarZona(z.id));
  ir('vista-ficha');
}
function resolver(sel){
  let z = 'desafio';
  if(sel.azar === 'visible' || sel.capa === 'incertidumbre') z = 'probabilidad';
  else if(sel.presion === 'reloj') z = 'velocidad';
  else if(sel.gesto === 'retener') z = 'memoria';
  else if(sel.azar === 'oculto' || sel.gesto === 'manipular' || sel.capa === 'cambio') z = 'construccion';
  else if(sel.gesto === 'organizar' || sel.capa === 'dato' || sel.capa === 'relacion') z = 'analisis';
  else if(sel.capa === 'espacio') z = 'tiempo';
  else if(sel.capa === 'operacion') z = 'calculo';
  else if(sel.gesto === 'buscar') z = 'concentracion';
  else if(sel.producto === 'pronostico' || sel.social === 'turno') z = 'estrategia';
  return DATA.zonas.find(x=>x.id===z);
}
const RECETA = {
  desafio:"Fija un criterio. Sube una sola variable por peldaño.",
  memoria:"Se muestra, se tapa, se usa. Lo tapado es cantidad o relación.",
  velocidad:"Un criterio. Ráfaga. Reloj que sube. Sin ranking.",
  estrategia:"Reserva visible. Cada jugada gasta.",
  concentracion:"Escena casi correcta. Un defecto. El aviso orienta.",
  probabilidad:"La urna se ve. Se pronostica. Se extrae. Se registra.",
  tiempo:"El reloj o la línea son el material.",
  calculo:"Primero el desajuste. Después la cuenta.",
  analisis:"Dos estados a la vez. Qué cambia y qué no.",
  construccion:"Entrada, proceso, salida. Prueba libre y pronóstico."
};
function pintarAparato(){
  const el = $('vista-aparato');
  const ejes = DATA.ejes;
  const campos = [['gesto','Gesto'],['presion','Presión'],['azar','Azar'],['producto','Producto'],['social','Social'],['capa','Capa matemática']];
  el.innerHTML = `<div class="aparato"><div class="maquina"><h2>El aparato</h2><p style="color:#e4c5b5;font-weight:650">Seis ejes. La máquina señala la zona y deja la receta.</p><div class="ejes"></div></div><div class="salida" id="salida"></div></div>`;
  const box = el.querySelector('.ejes');
  campos.forEach(([k,lab])=>{
    const d = document.createElement('div');
    d.className = 'eje';
    d.innerHTML = `<label for="eje-${k}">${lab}</label><select id="eje-${k}">${ejes[k].map(([v,n])=>`<option value="${v}">${n}</option>`).join('')}</select>`;
    box.appendChild(d);
  });
  const leer = ()=>{
    const sel = {};
    campos.forEach(([k])=> sel[k] = $('eje-'+k).value);
    const z = resolver(sel);
    $('salida').innerHTML = `<span class="badge">Categoría</span><h3>${z.nombre}</h3><p>${z.lema}</p><div class="receta">${RECETA[z.id]}</div><button type="button" class="ir" id="irZona">Abrir ${z.nombre}</button>`;
    $('irZona').addEventListener('click', ()=> pintarZona(z.id));
  };
  campos.forEach(([k])=> $('eje-'+k).addEventListener('change', leer));
  leer();
}
$('tabSala').addEventListener('click', ()=>{ pintarSala(); ir('vista-sala'); });
$('tabAparato').addEventListener('click', ()=>{ pintarAparato(); ir('vista-aparato'); });
pintarSala();
</script>
</body>
</html>
