<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="s321:pieza" content="sala-de-juegos">
<title>Sala de juegos · Secuencia321</title>
<style>
:root{
  --pe-hondo:#0f2d3a; --pe-base:#173f50; --pe-caja:#2a4e5e; --pe-claro:#2c5c70; --pe-velo:#eaf0f2;
  --te-hondo:#8f3a1e; --te-base:#b04a2a; --te-caja:#b55537; --te-vivo:#c85f3c; --te-velo:#f0dccf;
  --lienzo:#f7f1e9; --fondo:#efe6d8; --papel:#fffcf7; --realce:#f9f3ea; --linea:#e2d6c4; --borde:#e4c5b5;
  --ti:#1b1512; --ti-m:#2e2622; --ti-t:#4a3f38;
  --ci:#5a3a52;
  --ok:#327a52; --ok-velo:#e7f1ea;
  --crema:#f7f1e9;
  --lora:"Lora",Georgia,"Times New Roman",serif;
  --nunito:"Nunito",system-ui,sans-serif;
  --mono:"Source Code Pro",ui-monospace,"Courier New",monospace;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s6:24px; --s8:32px; --s12:48px;
  --radio:12px; --radio-sm:8px;
  --sombra:0 1px 3px rgba(15,45,58,.06);
  --m100:100ms; --m150:150ms; --m200:200ms; --m300:300ms;
  --out:cubic-bezier(.16,1,.3,1); --in:cubic-bezier(.7,0,.84,0);
  --prosa:70ch;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100dvh;
  background:#0f2d3a;
  color:var(--crema);
  font-family:var(--nunito);
  font-size:1rem;
  font-weight:400;
  line-height:1.55;
}
body::before{
  content:"";
  position:fixed; inset:0; pointer-events:none;
  background-image:linear-gradient(rgba(247,241,233,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(247,241,233,.04) 1px, transparent 1px);
  background-size:32px 32px;
  mask-image:linear-gradient(#000, transparent 520px);
}
.skip{position:absolute; left:16px; top:8px; transform:translateY(-150%); background:var(--papel); color:var(--ti); padding:8px 16px; border-radius:8px; z-index:30; font-weight:500}
.skip:focus{transform:none}
:focus{outline:none}
:focus-visible{outline:2px solid #e08a5f; outline-offset:2px}
.sr{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0}
#app{position:relative; z-index:1; max-width:1440px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column; padding:0 24px}
.barra{
  position:sticky; top:0; z-index:8;
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  min-height:64px; padding:8px 0;
  background:#173f50;
  border-bottom:1px solid rgba(247,241,233,.16);
}
.marca{display:flex; align-items:center; gap:12px; color:inherit; text-decoration:none; min-height:44px; font-family:var(--lora); font-weight:600; font-size:1.25rem; letter-spacing:-.02em; line-height:1.2}
.marca svg{width:36px; height:36px; flex:0 0 auto}
.nav{display:flex; gap:4px; margin-left:auto; flex-wrap:wrap}
.nav a,.btn{
  display:inline-flex; align-items:center; justify-content:center;
  min-height:44px; padding:8px 16px; border-radius:8px;
  font:500 1rem/1.2 var(--nunito); text-decoration:none; color:var(--crema);
  border:1px solid transparent; background:transparent; cursor:pointer;
}
.nav a[aria-current="page"]{background:var(--te-hondo); border-color:var(--te-hondo)}
.nav a:not([aria-current="page"]):hover,.btn-ghost:hover{border-color:rgba(247,241,233,.28)}
.btn-primario,.accion{
  background:var(--te-hondo); color:var(--crema); border:1px solid var(--te-hondo);
  display:inline-flex; align-items:center; min-height:44px; padding:8px 16px; border-radius:8px;
  font:500 1rem/1.2 var(--nunito); text-decoration:none; cursor:pointer;
}
.btn-sec{
  background:transparent; color:var(--te-hondo); border:1px solid var(--borde);
  display:inline-flex; align-items:center; min-height:44px; padding:8px 16px; border-radius:8px;
  font:500 1rem/1.2 var(--nunito); cursor:pointer;
}
.btn-ghost{border:1px solid rgba(247,241,233,.28); background:transparent; color:var(--crema)}
main{flex:1}
.lienzo{padding:24px 0 32px; transition:opacity var(--m200) var(--out), transform var(--m200) var(--out)}
.lienzo.sale{opacity:0; transform:translateY(8px); transition-duration:var(--m150); transition-timing-function:var(--in)}
h1,h2,h3{font-family:var(--lora); font-weight:600; line-height:1.2; letter-spacing:-.02em}
h1{font-size:clamp(1.75rem,3vw,2.25rem); margin:0 0 8px}
h2{font-size:1.25rem; margin:0}
h3{font-size:1.25rem; margin:0; color:var(--pe-hondo)}
.bajada{margin:0; max-width:var(--prosa); color:var(--crema)}
.kicker{margin:0 0 8px; font-family:var(--mono); font-size:.75rem; line-height:1.4; color:#f3e6df}
.papel{background:var(--papel); color:var(--ti); border:1px solid var(--linea); border-radius:var(--radio); box-shadow:var(--sombra), inset 0 1px 0 rgba(255,255,255,.65)}
.portada{display:grid; gap:24px}
.entrada{max-width:760px}
.resumen{display:flex; flex-wrap:wrap; gap:16px 24px; margin:16px 0 0; font-size:.875rem; color:#f3e6df}
.acciones{display:flex; flex-wrap:wrap; gap:8px; margin-top:16px}
.ahora{display:grid; grid-template-columns:1fr; gap:16px; align-items:center; padding:16px}
.ahora svg{width:96px; height:96px; color:var(--pe-base)}
.ahora h2{color:var(--pe-hondo)}
.ahora p{margin:8px 0 0}
.indice{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin:0; padding:0; list-style:none}
.indice a{
  display:flex; align-items:baseline; gap:8px; min-height:44px; padding:8px 12px;
  color:var(--ti); text-decoration:none; background:var(--papel); border:1px solid var(--linea); border-radius:8px;
}
.indice .n{font-family:var(--mono); font-size:.75rem; color:var(--ti-t)}
.indice strong{font-weight:600; font-family:var(--lora)}
.mosaico{display:grid; grid-template-columns:1fr; gap:16px}
.sala-btn{
  appearance:none; text-align:left; cursor:pointer; color:var(--ti); width:100%;
  background:var(--papel); border:1px solid var(--linea); border-radius:var(--radio);
  box-shadow:var(--sombra), inset 0 1px 0 rgba(255,255,255,.65);
  padding:16px; min-height:44px; display:grid; grid-template-columns:56px 1fr; gap:12px 16px; align-items:start;
  transition:border-color var(--m150) var(--out), transform var(--m200) var(--out);
}
.sala-btn svg{width:56px; height:56px; color:var(--pe-base)}
.sala-btn .n{font-family:var(--mono); font-size:.75rem; color:var(--ti-t); line-height:1.4}
.sala-btn .lema{margin:4px 0 0}
.sala-btn .gesto{margin:8px 0 0; font-size:.875rem; color:var(--ti-t)}
.pie{grid-column:1 / -1; display:flex; justify-content:space-between; gap:12px; align-items:baseline; padding-top:8px; border-top:1px solid var(--linea); font-size:.875rem}
.ok{color:var(--ok); font-weight:500}
.espera{color:var(--ti-t); font-weight:500}
.cue{color:var(--te-hondo); font-weight:500}
.trazo{stroke:var(--marca, currentColor)}
.volver{appearance:none; background:none; border:0; color:#f3e6df; min-height:44px; padding:8px 0; font:500 1rem/1.2 var(--nunito); cursor:pointer}
.cabeza-sala{margin-bottom:24px; max-width:80ch}
.layout-sala{display:grid; gap:24px}
.tabs{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 8px}
.tabs button{min-height:44px; padding:8px 16px; border-radius:8px; border:1px solid #346375; background:#234c5e; color:var(--crema); font:500 .875rem/1.2 var(--nunito); cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--papel); color:var(--ti); border-color:var(--papel)}
.panel{padding:16px; max-width:var(--prosa)}
.panel p{margin:0}
.mecanicas{margin:12px 0 0; font-family:var(--mono); font-size:.75rem; line-height:1.4; color:var(--ti-t)}
.catalogo, .lista{
  list-style:none; margin:0; padding:0; background:var(--papel); color:var(--ti);
  border:1px solid var(--linea); border-radius:var(--radio); overflow:hidden;
}
.catalogo li, .lista li{padding:16px; border-bottom:1px solid var(--linea); display:flex; flex-direction:column; gap:8px}
.catalogo li:last-child, .lista li:last-child{border-bottom:0}
.sinopsis{margin:0; color:var(--ti-m)}
.estado{margin:0; font-size:.875rem; color:var(--ti-t)}
.fila-acc{display:flex; flex-wrap:wrap; gap:8px}
.filtros{display:grid; gap:12px; margin:0 0 16px}
.campo label{display:block; margin-bottom:8px; font-size:.875rem; font-weight:500; color:#f3e6df}
.campo input,.campo select{
  width:100%; min-height:44px; border-radius:8px; border:1px solid var(--linea);
  background:var(--papel); color:var(--ti); padding:8px 12px; font:400 1rem/1.4 var(--nunito);
}
.cuenta{margin:0 0 12px; font-size:.875rem; color:#f3e6df}
.vacio{padding:16px; max-width:var(--prosa)}
.ficha{max-width:760px}
.nota{max-width:var(--prosa); color:#f3e6df; font-size:.875rem}
.ejes{display:grid; gap:16px; margin:24px 0}
.resultado{padding:16px}
.resultado h2{color:var(--pe-hondo); margin:4px 0 8px; font-size:1.5rem}
.receta{margin:12px 0; padding:12px 16px; border-left:4px solid var(--te-hondo); background:var(--realce)}
.aviso{padding:12px 16px; background:#234c5e; border:1px solid #346375; border-radius:8px; max-width:var(--prosa)}
.meta{margin:8px 0 0; font-size:.875rem; color:#f3e6df}
footer.pie-pag{
  margin-top:auto; display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap;
  padding:16px 0 24px; border-top:1px solid rgba(247,241,233,.16); color:#f3e6df; font-size:.75rem; line-height:1.4;
}
footer.pie-pag p{margin:0}
@media (hover:hover) and (pointer:fine){
  .sala-btn:hover{border-color:var(--borde); transform:translateY(-4px)}
}
@media (min-width:700px){
  .indice{grid-template-columns:repeat(5,minmax(0,1fr))}
  .ahora{grid-template-columns:1.2fr .8fr}
  .ejes{grid-template-columns:1fr 1fr}
  .filtros{grid-template-columns:1.4fr .8fr .8fr auto; align-items:end}
  .lista{display:grid; grid-template-columns:1fr 1fr}
  .lista li{border-right:1px solid var(--linea)}
  .lista li:nth-child(2n){border-right:0}
}
@media (min-width:900px){
  .mosaico{grid-template-columns:1fr 1fr}
  .layout-sala{grid-template-columns:1fr 320px; align-items:start}
  .layout-sala .pedagogia{position:sticky; top:80px}
  .catalogo{display:grid; grid-template-columns:1fr 1fr}
  .catalogo li{border-right:1px solid var(--linea)}
  .catalogo li:nth-child(2n){border-right:0}
}
@media (min-width:1180px){
  .mosaico{grid-template-columns:1fr 1fr 1fr}
  .sala-btn[data-sala="desafio"]{grid-column:span 2; grid-template-columns:72px 1fr}
  .ejes{grid-template-columns:1fr 1fr 1fr}
}
@media (max-width:699px){
  #app{padding:0 16px}
  .nav{margin-left:0}
}
body.proyeccion footer.pie-pag,
body.proyeccion .kicker,
body.proyeccion .mecanicas{display:none}
body.proyeccion h1{font-size:2.25rem}
body.proyeccion .sala-btn h2,
body.proyeccion .lista h3,
body.proyeccion .catalogo h3{font-size:1.5rem}
body.proyeccion .barra{min-height:56px}
@media (prefers-reduced-motion:reduce){
  .lienzo,.lienzo.sale,.sala-btn{transition:opacity var(--m100) ease; transform:none !important}
}
</style>
</head>

<script type="application/json" id="datos">{"zonas": [{"id": "desafio", "nombre": "Desafío", "lema": "La dificultad sube. El reloj no manda.", "gesto": "Producir y decidir con exigencia creciente", "presion": "calma-exigente", "acento": "#b04a2a", "presentacion": {"que_es": "Una ronda vale si el siguiente peldaño pide más que el anterior: más cifras, una condición nueva, o un camino que ya no se puede resolver de un golpe de vista.", "como_se_articula": "Se fija un criterio único. Se construyen diez peldaños. Cada peldaño cambia una sola variable. El estudiante ve el peldaño, resuelve, y solo entonces aparece el siguiente. No hay ranking. Hay umbral.", "que_no_es": "No es una lista de ejercicios con confeti. Si el gesto no cambia de exigencia, es cálculo disfrazado.", "para_el_aula": "En PDI, un estudiante resuelve el peldaño a la vista. El resto pronostica si va a alcanzar. El maestro señala el criterio, no la cuenta.", "mecanicas": ["PR-2", "PR-3", "EL-2", "BU-1"]}, "juegos": [{"id": "tres-condiciones", "nombre": "Tres condiciones", "sinopsis": "Cada grupo de casillas cumple una condición. Las fichas de dominó no se solapan.", "estado": "listo", "archivo": "juegos/desafio/tres-condiciones/tres-condiciones.html"}]}, {"id": "memoria", "nombre": "Memoria", "lema": "Lo que se tapó sigue contando.", "gesto": "Retener y emparejar", "presion": "calma", "acento": "#5a3a52", "presentacion": {"que_es": "Se muestra, se tapa, se pide. La matemática no está en recordar dibujos: está en recordar una cantidad, una relación o una posición que todavía sirve.", "como_se_articula": "Tres tiempos en la misma pantalla: se ve · se cubre · se usa. El material tapado y el que queda a la vista tienen que hablarse. Si al destapar no hay nada que calcular, era memoria de naipes.", "que_no_es": "No es Memory de figuritas. Dos cartas iguales sin valor matemático no entran.", "para_el_aula": "Tocar en la pizarra. Pocas cartas, grandes. El maestro pregunta qué se está guardando: el número, el lugar, o la relación.", "mecanicas": ["RE-1", "MO-1", "EX-3", "PR-2"]}, "juegos": [{"id": "parejas-de-valor", "nombre": "Parejas de valor", "sinopsis": "Se unen dos caras que valen lo mismo con distinta ropa.", "estado": "idea", "archivo": "juegos/memoria/parejas-de-valor.html"}, {"id": "eco-de-cifras", "nombre": "Eco de cifras", "sinopsis": "Una fila se muestra tres segundos. Hay que reconstruirla.", "estado": "idea", "archivo": "juegos/memoria/eco-de-cifras.html"}, {"id": "mesa-tapada", "nombre": "Mesa tapada", "sinopsis": "Se cubren platos. Decir cuántos quedan sin destaparlos todos.", "estado": "idea", "archivo": "juegos/memoria/mesa-tapada.html"}, {"id": "el-orden-que-se-fue", "nombre": "El orden que se fue", "sinopsis": "Se vio una secuencia. Reaparece desordenada. Hay que devolverla.", "estado": "idea", "archivo": "juegos/memoria/el-orden-que-se-fue.html"}, {"id": "dos-vistazos", "nombre": "Dos vistazos", "sinopsis": "Primera mirada: cantidades. Segunda: la pregunta. No hay tercera.", "estado": "idea", "archivo": "juegos/memoria/dos-vistazos.html"}, {"id": "la-caja-de-tres", "nombre": "La caja de tres", "sinopsis": "Solo tres casillas a la vista. Las demás se recuerdan.", "estado": "idea", "archivo": "juegos/memoria/la-caja-de-tres.html"}, {"id": "espejo-tardio", "nombre": "Espejo tardío", "sinopsis": "Lo de la izquierda se tapó. Lo de la derecha pide el complemento.", "estado": "idea", "archivo": "juegos/memoria/espejo-tardio.html"}, {"id": "ruta-borrada", "nombre": "Ruta borrada", "sinopsis": "Un camino se recorrió. Hay que repetirlo de memoria sobre el plano.", "estado": "idea", "archivo": "juegos/memoria/ruta-borrada.html"}, {"id": "fichas-que-caminan", "nombre": "Fichas que caminan", "sinopsis": "Se movieron dos. Decir cuáles, sin haberlas seguido con el dedo.", "estado": "idea", "archivo": "juegos/memoria/fichas-que-caminan.html"}, {"id": "el-total-escondido", "nombre": "El total escondido", "sinopsis": "Se vieron partes. El total se pide cuando ya no están.", "estado": "idea", "archivo": "juegos/memoria/el-total-escondido.html"}, {"id": "memoria-de-lugar", "nombre": "Memoria de lugar", "sinopsis": "Cada cantidad vivía en un sitio. El sitio se vació.", "estado": "idea", "archivo": "juegos/memoria/memoria-de-lugar.html"}, {"id": "la-carta-testigo", "nombre": "La carta testigo", "sinopsis": "Una carta queda destapada para comparar. Las otras no.", "estado": "idea", "archivo": "juegos/memoria/la-carta-testigo.html"}]}, {"id": "velocidad", "nombre": "Velocidad", "lema": "El pulso sube. Nadie pierde delante de la clase.", "gesto": "Reaccionar contra el reloj", "presion": "reloj", "acento": "#c85f3c", "presentacion": {"que_es": "Un solo criterio ya construido se aplica muchas veces, rápido. El reloj sube. No hay ranking ni nombres. «Jugar otra vez» borra la ronda y no avanza nada.", "como_se_articula": "Se declara el criterio en una frase. Se lanza una ráfaga de ítems cortos. Se cuenta lo acertado, no a quién. Al repetir, cero y burbuja cerrada.", "que_no_es": "No es un examen cronometrado de operaciones peladas. Si el criterio no cabe en una línea, no es velocidad: es desafío.", "para_el_aula": "Toda la clase puede decir en voz baja. Un estudiante toca. Nadie queda último en un tablero.", "mecanicas": ["RE-2", "BU-1", "BU-3", "EL-1"]}, "juegos": [{"id": "rafaga", "nombre": "Ráfaga", "sinopsis": "Doce ítems del mismo criterio. El reloj corre. Se puede repetir.", "estado": "idea", "archivo": "juegos/velocidad/rafaga.html"}, {"id": "pulso-de-tres", "nombre": "Pulso de tres", "sinopsis": "Tres decisiones seguidas. Si una falla, la ráfaga se reinicia.", "estado": "idea", "archivo": "juegos/velocidad/pulso-de-tres.html"}, {"id": "acepta-o-sigue", "nombre": "Acepta o sigue", "sinopsis": "Pasa lo que cumple. Descarta lo que no. El gesto es contenerse.", "estado": "idea", "archivo": "juegos/velocidad/acepta-o-sigue.html"}, {"id": "antes-del-tono", "nombre": "Antes del tono", "sinopsis": "Hay que tocar la cantidad justa antes de se_articula": "Tablero o reserva visible. Cada jugada gasta algo. Las consecuencias se leen en el propio tablero, no en una burbuja. Se puede rehacer el turno.", "que_no_es": "No es ajedrez con números pegados. Si no hay dilema (gastar ahora o guardar), es un ejercicio de pasos.", "para_el_aula": "Dos estudiantes proponen planes distintos. Se juega uno. Se compara con el que no se jugó.", "mecanicas": ["EL-2", "RE-3", "PR-4", "MA-4"]}, "juegos": [{"id": "el-colmado-justo", "nombre": "El colmado justo", "sinopsis": "Comprar con una reserva. Cada producto cambia lo que queda.", "estado": "idea", "archivo": "juegos/estrategia/el-colmado-justo.html"}, {"id": "cercar-el-numero", "nombre": "Cercar el número", "sinopsis": "Ir cerrando un intervalo. Cada ficha gasta un movimiento.", "estado": "idea", "archivo": "juegos/estrategia/cercar-el-numero.html"}, {"id": "dos-caminos", "nombre": "Dos caminos", "sinopsis": "Llegar al mismo total por rutas que no cuestan igual.", "estado": "idea", "archivo": "juegos/estrategia/dos-caminos.html"}, {"id": "guardar-o-usar", "nombre": "Guardar o usar", "sinopsis": "Una ficha potente. Gastarla ahora cierra un atajo y abre un hueco.", "estado": "idea", "archivo": "juegos/estrategia/guardar-o-usar.html"}, {"id": "el-reparto-tenso", "nombre": "El reparto tenso", "sinopsis": "Partir una cantidad entre tres destinos que no se pueden quedar cortos.", "estado": "idea", "archivo": "juegos/estrategia/el-reparto-tenso.html"}, {"id": "bloquear-la-casilla", "nombre": "Bloquear la casilla", "sinopsis": "Ocupar para que el otro plan ya no quepa.", "estado": "idea", "archivo": "juegos/estrategia/bloquear-la-casilla.html"}, {"id": "tres-turnos", "nombre": "Tres turnos", "sinopsis": "Solo tres jugadas. Hay que dejar el tablero en la meta.", "estado": "idea", "archivo": "juegos/estrategia/tres-turnos.html"}, {"id": "la-reserva-ciega", "nombre": "La reserva ciega", "sinopsis": "Se ve lo que hay, no lo que vendrá. Hay que dejar margen.", "estado": "idea", "arc   const Router = {
    parse(hash){
      const raw = (hash || location.hash || "#inicio").replace(/^#/, "");
      const [a, b, c] = raw.split("/").map(decodeURIComponent);
      if (!a || a === "inicio") return { vista:"inicio" };
      if (a === "salas") return { vista:"salas" };
      if (a === "catalogo") return { vista:"catalogo" };
      if (a === "orientador") return { vista:"orientador" };
      if (a === "sala") return DataRepository.zona(b) ? { vista:"sala", zonaId:b } : { vista:"inicio", aviso:"Esa sala no está en la plataforma." };
      if (a === "juego") return (DataRepository.zona(b) && DataRepository.juego(b, c)) ? { vista:"ficha", zonaId:b, juegoId:c } : { vista:"inicio", aviso:"Ese juego no está en el catálogo." };
      return { vista:"inicio", aviso:"Esa dirección no corresponde a ninguna sección." };
    },
    hash(){ return location.hash || "#inicio"; },
    go(hash, opts){
      opts = opts || {};
      Focus.guardar();
      const modo = opts.volver ? "atras" : "adelante";
      if (this.hash() !== hash){
        history.pushState(null, "", hash);
        if (opts.volver){
          const i = State.pila.lastIndexOf(hash);
          if (i >= 0) State.pila = State.pila.slice(0, i + 1);
        } else State.pila.push(hash);
      }
      View.transicion(modo);
    }
  };

  function anunciar(t){ document.getElementById("aviso").textContent = t; }
  function syncNav(vista){
    const mapa = { inicio:"nav-inicio", salas:"nav-salas", sala:"nav-salas", ficha:"nav-salas", catalogo:"nav-catalogo", orientador:"nav-orientador" };
    document.querySelectorAll(".nav a").forEach(a => a.removeAttribute("aria-current"));
    const id = mapa[vista];
    if (id) document.getElementById(id).setAttribute("aria-current", "page");
  }

  const Views = {
    inicio(r){
      const t = totales();
      const aviso = r.aviso ? '<p class="aviso" role="status">' + esc(r.aviso) + "</p>" : "";
      const listo = DataRepository.todos().find(x => x.juego.estado === "listo");
      const indice = DataRepository.zonas().map((z, i) => {
        const n = String(i + 1).padStart(2, "0");
        return '<li><a id="atajo-' + z.id + '" data-go="#sala/' + z.id + '" href="#sala/' + z.id + '"><span class="n">' + n + '</span><strong>' + esc(z.nombre) + '</strong></a></li>';
      }).join("");
      return '<section class="portada"><div class="entrada"><p class="kicker">Plataforma</p><h1>Diez salas, un gesto cada una.</h1><p class="bajada">Aquí se organizan los juegos de matemática escolar. Cada sala pide una forma distinta de actuar. El catálogo crece por salas, no como una lista suelta.</p><p class="resumen"><span>' + t.listos + ' disponible ahora</span><span>' + t.previstos + ' previstos</span><span>10 salas</span></p><div class="acciones"><a class="btn-primario" data-go="#salas" href="#salas">Explorar salas</a><a class="btn btn-ghost" data-go="#catalogo" href="#catalogo">Abrir catálogo</a><a class="btn btn-ghost" data-go="#orientador" href="#orientador">Usar el orientador</a></div>' + aviso + '</div><article class="papel ahora"><div><p class="kicker" style="color:var(--ti-t)">Se puede abrir ahora</p><h2>' + esc(listo.juego.nombre) + '</h2><p>' + esc(listo.juego.sinopsis) + '</p><p class="estado">Sala ' + esc(listo.zona.nombre) + '. Disponible.</p><div class="fila-acc"><a class="accion" href="' + esc(listo.juego.archivo) + '">Abrir juego</a><button type="button" class="btn-sec" id="ficha-ahora" data-go="#juego/' + listo.zona.id + '/' + listo.juego.id + '">Ver ficha</button></div></div><div>' + MARCAS[listo.zona.id] + '</div></article><section><h2 style="color:var(--crema);margin:0 0 12px">Las salas</h2><ol class="indice">' + indice + '</ol></section></section>';
    },
    salas(){
      const cards = DataRepository.zonas().map((z, i) => {
        const d = disp(z);
        const n = String(i + 1).padStart(2, "0");
        return '<button type="button" class="sala-btn" data-sala="' + z.id + '" id="sala-' + z.id + '" data-go="#sala/' + z.id + '" style="--marca:' + z.acento + '"><span>' + MARCAS[z.id] + '</span><span><span class="n">' + n + '</span><h2>' + esc(z.nombre) + '</h2><p class="lema">' + esc(z.lema) + '</p><p class="gesto">' + esc(z.gesto) + '</p></span><span class="pie"><span class="' + d.clase + '">' + esc(d.estado) + '. ' + esc(d.detalle) + '</span><span class="cue">Entrar en ' + esc(z.nombre) + '</span></span></button>';
      }).join("");
      return '<section><p class="kicker">Salas</p><h1>Diez lógicas de juego</h1><p class="bajada">El orden va del 1 al 10. Cada sala conserva su gesto. Entra en una para ver sus juegos.</p></section><div class="mosaico" style="margin-top:24px">' + cards + '</div>';
    },
    sala(id){
      const z = DataRepository.zona(id);
      const d = disp(z);
      const n = String(DataRepository.zonas().indexOf(z) + 1).padStart(2, "0");
      const bloques = [["que","Qué es", z.presentacion.que_es],["como","Cómo funciona", z.presentacion.como_se_articula],["no","Qué no es", z.presentacion.que_no_es],["aula","En el aula", z.presentacion.para_el_aula]];
      const tabs = bloques.map((b, i) => '<button type="button" role="tab" id="tab-' + b[0] + '" aria-controls="panel-' + b[0] + '" aria-selected="' + (i ? "false" : "true") + '" tabindex="' + (i ? "-1" : "0") + '">' + b[1] + '</button>').join("");
      const panels = bloques.map((b, i) => '<div role="tabpanel" class="papel panel" id="panel-' + b[0] + '" aria-labelledby="tab-' + b[0] + '"' + (i ? " hidden" : "") + '><p>' + esc(b[2]) + '</p>' + (i ? "" : '<p class="mecanicas">Mecánicas ' + esc(z.presentacion.mecanicas.join(", ")) + '</p>') + '</div>').join("");
      const juegos = z.juegos.map(j => tarjetaJuego(z, j)).join("");
      return '<article class="cabeza-sala"><button type="button" class="volver" id="volver-salas" data-go="#salas" data-volver="1">Volver a las salas</button><p class="kicker">' + n + ' · ' + esc(PRESION[z.presion] || z.presion) + '</p><h1>' + esc(z.nombre) + '</h1><p class="bajada">' + esc(z.lema) + '</p><p class="meta">' + esc(z.gesto) + '. ' + esc(d.estado) + '. ' + esc(d.detalle) + '.</p></article><div class="layout-sala"><div><h2 style="margin:0 0 12px">Juegos</h2><ul class="catalogo">' + juegos + '</ul></div><div class="pedagogia"><div class="tabs" role="tablist" aria-label="Información de la sala">' + tabs + '</div>' + panels + '</div></div>';
    },
    ficha(zid, jid){
      const z = DataRepository.zona(zid);
      const j = DataRepository.juego(zid, jid);
      const listo = j.estado === "listo";
      const cuerpo = listo
        ? '<p class="sinopsis">' + esc(j.sinopsis) + '</p><p class="estado">Disponible. El juego abre en su propia página.</p><div class="fila-acc"><a class="accion" href="' + esc(j.archivo) + '">Abrir juego</a></div>'
        : '<p class="sinopsis">' + esc(j.sinopsis) + '</p><p class="estado">En desarrollo. Todavía no se puede abrir.</p>';
      return '<article class="ficha"><button type="button" class="volver" id="volver-sala" data-go="#sala/' + z.id + '" data-volver="1">Volver a ' + esc(z.nombre) + '</button><p class="kicker">' + esc(z.nombre) + ' · ' + esc(z.gesto) + '</p><h1>' + esc(j.nombre) + '</h1><div class="papel panel">' + cuerpo + '<p class="estado" style="margin-top:12px">Esta ficha pertenece a la sala ' + esc(z.nombre) + '. ' + esc(z.lema) + '</p></div></article>';
    },
    catalogo(){
      const salas = DataRepository.zonas().map(z => '<option value="' + z.id + '">' + esc(z.nombre) + '</option>').join("");
      return '<section><p class="kicker">Catálogo</p><h1>Todos los juegos</h1><p class="bajada">Busca por nombre o por lo que dice la sinopsis. Filtra por sala o por lo que ya se puede abrir.</p></section><form class="filtros" id="form-catalogo" style="margin-top:24px" role="search"><div class="campo"><label for="buscar">Buscar</label><input id="buscar" type="search" autocomplete="off" value="' + esc(State.catalogo.q) + '"></div><div class="campo"><label for="filtro-sala">Sala</label><select id="filtro-sala"><option value="">Todas las salas</option>' + salas + '</select></div><div class="campo"><label for="filtro-estado">Disponibilidad</label><select id="filtro-estado"><option value="">Todas</option><option value="listo">Disponibles</option><option value="idea">En desarrollo</option></select></div><button type="button" class="btn-sec" id="limpiar" style="color:var(--crema);border-color:rgba(247,241,233,.28)">Limpiar filtros</button></form><p class="cuenta" id="cuenta" aria-live="polite"></p><ul class="lista" id="lista-juegos"></ul><div class="papel vacio" id="vacio" hidden><p>Ningún juego coincide. Prueba otro nombre o limpia los filtros.</p><div class="fila-acc" style="margin-top:12px"><button type="button" class="btn-sec" id="limpiar-vacio">Limpiar filtros</button></div></div>';
    },
    orientador(){
      const campos = [["gesto","Gesto","La acción que hace el estudiante."],["presion","Presión","El pulso de la ronda."],["azar","Azar","Si el azar se ve, se esconde o no entra."],["producto","Producto","Lo que queda al terminar."],["social","Social","Quién actúa delante de la clase."],["capa","Capa matemática","El tipo de contenido que se pone en juego."]];
      let guardado = State.aparato;
      try { if (!guardado) guardado = JSON.parse(sessionStorage.getItem("s321-orientador") || "null"); } catch (e) { guardado = null; }
      const ejes = campos.map(([k, lab, ayuda]) => {
        const opts = DataRepository.ejes()[k].map(([v, n]) => '<option value="' + esc(v) + '"' + (guardado && guardado[k] === v ? " selected" : "") + '>' + esc(n) + '</option>').join("");
        return '<div class="campo eje"><label for="eje-' + k + '">' + lab + '</label><select id="eje-' + k + '">' + opts + '</select><p class="nota">' + ayuda + '</p></div>';
      }).join("");
      return '<section class="entrada"><p class="kicker">Orientador</p><h1>Encontrar la sala</h1><p class="bajada">Seis ejes para localizar la lógica dominante. No es una clasificación cerrada: una propuesta puede compartir rasgos con más de una sala.</p></section><div class="ejes">' + ejes + '</div><div class="papel resultado" id="salida" aria-live="polite"></div>';
    }
  };

  function tarjetaJuego(z, j){
    const listo = j.estado === "listo";
    const acciones = listo
      ? '<a class="accion" href="' + esc(j.archivo) + '">Abrir juego</a><button type="button" class="btn-sec" id="concepto-' + z.id + '-' + j.id + '" data-go="#juego/' + z.id + '/' + j.id + '">Ver ficha</button>'
      : '<button type="button" class="btn-sec" id="concepto-' + z.id + '-' + j.id + '" data-go="#juego/' + z.id + '/' + j.id + '">Ver concepto</button>';
    return '<li><p class="estado">' + esc(z.nombre) + '</p><h3>' + esc(j.nombre) + '</h3><p class="sinopsis">' + esc(j.sinopsis) + '</p><p class="estado">' + (listo ? "Disponible" : "En desarrollo") + '</p><div class="fila-acc">' + acciones + '</div></li>';
  }

  const Catalog = {
    items: [],
    mount(){
      const selS = document.getElementById("filtro-sala");
      const selE = document.getElementById("filtro-estado");
      if (selS) selS.value = State.catalogo.sala;
      if (selE) selE.value = State.catalogo.disp;
      const lista = document.getElementById("lista-juegos");
      this.items = DataRepository.todos();
      lista.innerHTML = this.items.map(x => tarjetaJuego(x.zona, x.juego)).join("");
      this.apply(false);
    },
    apply(anuncia){
      const q = plano(State.catalogo.q);
      const sala = State.catalogo.sala;
      const disp = State.catalogo.disp;
      const lis = document.querySelectorAll("#lista-juegos li");
      let n = 0;
      this.items.forEach((x, i) => {
        const texto = plano(x.juego.nombre + " " + x.juego.sinopsis);
        const ok = (!q || texto.includes(q)) && (!sala || x.zona.id === sala) && (!disp || x.juego.estado === disp);
        lis[i].hidden = !ok;
        if (ok) n++;
      });
      const cuenta = document.getElementById("cuenta");
      const vacio = document.getElementById("vacio");
      const frase = n === 1 ? "1 juego" : n + " juegos";
      if (cuenta) cuenta.textContent = frase;
      if (vacio) vacio.hidden = n !== 0;
      const lista = document.getElementById("lista-juegos");
      if (lista) lista.hidden = n === 0;
      if (anuncia && cuenta) anunciar(frase);
    },
    schedule(){
      clearTimeout(State.timer);
      State.timer = setTimeout(() => {
        State.catalogo.q = document.getElementById("buscar").value;
        this.apply(true);
      }, 200);
    },
    limpiar(){
      State.catalogo = { q:"", sala:"", disp:"", orden:"sala" };
      const b = document.getElementById("buscar");
      if (b) b.value = "";
      document.getElementById("filtro-sala").value = "";
      document.getElementById("filtro-estado").value = "";
      this.apply(true);
      b.focus();
    }
  };

  function orientar(sel){
    let id = "desafio";
    if (sel.azar === "visible" || sel.capa === "incertidumbre") id = "probabilidad";
    else if (sel.presion === "reloj") id = "velocidad";
    else if (sel.gesto === "retener") id = "memoria";
    else if (sel.azar === "oculto" || sel.gesto === "manipular" || sel.capa === "cambio") id = "construccion";
    else if (sel.gesto === "organizar" || sel.capa === "dato" || sel.capa === "relacion") id = "analisis";
    else if (sel.capa === "espacio") id = "tiempo";
    else if (sel.capa === "operacion") id = "calculo";
    else if (sel.gesto === "buscar") id = "concentracion";
    else if (sel.producto === "pronostico" || sel.social === "turno") id = "estrategia";
    return { zona: DataRepository.zona(id), porque: PORQUE[id] };
  }
  const Orientation = {
    leer(){
      const sel = {};
      ["gesto","presion","azar","producto","social","capa"].forEach(k => { sel[k] = document.getElementById("eje-" + k).value; });
      State.aparato = sel;
      try { sessionStorage.setItem("s321-orientador", JSON.stringify(sel)); } catch (e) {}
      const r = orientar(sel);
      const z = r.zona;
      document.getElementById("salida").innerHTML = '<p class="kicker" style="color:var(--ti-t)">Orientación</p><h2>' + esc(z.nombre) + '</h2><p>' + esc(z.lema) + '</p><p class="estado">' + esc(r.porque) + '</p><div class="receta">' + esc(RECETA[z.id]) + '</div><button type="button" class="btn-primario" data-go="#sala/' + z.id + '">Abrir sala ' + esc(z.nombre) + '</button>';
    }
  };

  const Projection = {
    set(on){
      State.proyeccion = on;
      document.body.classList.toggle("proyeccion", on);
      const b = document.getElementById("btnProyeccion");
      b.setAttribute("aria-pressed", on ? "true" : "false");
      b.textContent = on ? "Cerrar proyección" : "Ampliar proyección";
    }
  };

  const View = {
    pintar(modo){
      const r = Router.parse();
      const lienzo = document.getElementById("lienzo");
      let html = "";
      if (r.vista === "inicio") html = Views.inicio(r);
      else if (r.vista === "salas") html = Views.salas();
      else if (r.vista === "sala") html = Views.sala(r.zonaId);
      else if (r.vista === "ficha") html = Views.ficha(r.zonaId, r.juegoId);
      else if (r.vista === "catalogo") html = Views.catalogo();
      else html = Views.orientador();
      lienzo.innerHTML = html;
      if (r.vista === "catalogo") Catalog.mount();
      if (r.vista === "orientador") Orientation.leer();
      if (r.vista === "sala") this.tabs();
      syncNav(r.vista);
      const titulo = lienzo.querySelector("h1");
      anunciar(titulo ? titulo.textContent : "Sala de juegos");
      if (modo === "atras"){
        const dest = document.getElementById(Focus.mapa[Router.hash()] || "");
        Focus.poner(dest || titulo);
        window.scrollTo(0, Focus.scroll[Router.hash()] || 0);
      } else {
        window.scrollTo(0, 0);
        Focus.poner(titulo);
      }
    },
    transicion(modo){
      const lienzo = document.getElementById("lienzo");
      if (Motion.reducido() || !lienzo.firstChild){ this.pintar(modo); return; }
      lienzo.classList.add("sale");
      setTimeout(() => {
        this.pintar(modo);
        lienzo.classList.remove("sale");
      }, 150);
    },
    tabs(){
      const btns = [...document.querySelectorAll('#lienzo [role="tab"]')];
      function elegir(i, focus){
        btns.forEach((t, k) => {
          const on = k === i;
          t.setAttribute("aria-selected", on ? "true" : "false");
          t.tabIndex = on ? 0 : -1;
          document.getElementById(t.getAttribute("aria-controls")).hidden = !on;
        });
        if (focus) btns[i].focus();
      }
      btns.forEach((t, i) => {
        t.addEventListener("click", () => elegir(i, false));
        t.addEventListener("keydown", (e) => {
          if (!["ArrowRight","ArrowLeft","Home","End"].includes(e.key)) return;
          e.preventDefault();
          let n = i;
          if (e.key === "ArrowRight") n = (i + 1) % btns.length;
          if (e.key === "ArrowLeft") n = (i - 1 + btns.length) % btns.length;
          if (e.key === "Home") n = 0;
          if (e.key === "End") n = btns.length - 1;
          elegir(n, true);
        });
      });
    }
  };

  document.body.addEventListener("click", (e) => {
    const limpiar = e.target.closest("#limpiar, #limpiar-vacio");
    if (limpiar){ e.preventDefault(); Catalog.limpiar(); return; }
    const go = e.target.closest("[data-go]");
    if (!go) return;
    if (e.target.closest("a.accion")) return;
    e.preventDefault();
    Router.go(go.getAttribute("data-go"), { volver: go.hasAttribute("data-volver") });
  });
  document.body.addEventListener("input", (e) => {
    if (e.target.id === "buscar") Catalog.schedule();
  });
  document.body.addEventListener("change", (e) => {
    if (e.target.id === "filtro-sala" || e.target.id === "filtro-estado"){
      State.catalogo.sala = document.getElementById("filtro-sala").value;
      State.catalogo.disp = document.getElementById("filtro-estado").value;
      Catalog.apply(true);
    }
    if (e.target.id && e.target.id.indexOf("eje-") === 0) Orientation.leer();
  });
  document.getElementById("btnProyeccion").addEventListener("click", () => Projection.set(!State.proyeccion));
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && State.proyeccion){ Projection.set(false); document.getElementById("btnProyeccion").focus(); }
  });
  window.addEventListener("popstate", () => {
    const h = Router.hash();
    const i = State.pila.lastIndexOf(h);
    const atras = i >= 0 && i < State.pila.length - 1;
    if (atras) State.pila = State.pila.slice(0, i + 1);
    else if (State.pila[State.pila.length - 1] !== h) State.pila.push(h);
    View.transicion(atras ? "atras" : "adelante");
  });

  const data = DataRepository.load();
  const errores = DataValidator.run(data);
  if (errores.length){
    document.getElementById("lienzo").innerHTML = '<h1>El catálogo no se pudo abrir</h1><p class="aviso">' + esc(errores[0]) + '</p>';
  } else if (!location.hash){
    history.replaceState(null, "", "#inicio");
    View.pintar("adelante");
  } else {
    View.pintar("adelante");
  }
})();
</script>
</body>
</html>
